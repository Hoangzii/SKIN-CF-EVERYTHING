<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weapon</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f5;--card:#fff;--tx:#111;--sub:#555;--line:#d9d9d9;--accent:#1677ff;--label:#99ccff;--label-tx:#111;--scope-bg:#000}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f1f;--tx:#eee;--sub:#aaa;--line:#3a3a3a;--label:#2b4a73;--label-tx:#fff}}
*{box-sizing:border-box}
body{margin:0;font-family:'Lexend',system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:20px 16px 40px}
h1{text-align:center;margin:6px 0 2px;font-size:26px;font-weight:700}
.ver{text-align:center;color:var(--sub);font-size:13px;margin-bottom:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px auto;max-width:1300px}
.bar input[type=text]{width:min(420px,100%);padding:8px 12px}
input,select,button{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--tx)}
select{min-width:140px;max-width:220px}
button{cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
label.chk{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
#filters{flex-wrap:nowrap;overflow-x:auto;max-width:1600px;justify-content:stretch;align-items:center}
#filters select{flex:1 1 0;min-width:0;max-width:none}
#filters label.chk{flex:none;white-space:nowrap}
#filters .tsel{flex:1 1 0;min-width:0;position:relative;padding:7px 28px 7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--tx);font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
#filters .tsel::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--sub)}
.tm{position:fixed;z-index:70;display:none;align-items:flex-start;font-size:13px}
.tm.on{display:flex}
.tm .p1,.tm .p2,.tm .p3{background:var(--card);color:var(--tx);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.25);max-height:70vh;overflow-y:auto;min-width:150px}
.tm .p2,.tm .p3{display:none;margin-left:-1px}
.tm .mi{display:flex;justify-content:space-between;gap:14px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.tm .mi:hover,.tm .mi.act{background:var(--accent);color:#fff}
.tm .mi .ar{font-size:9px;opacity:.7;align-self:center}
.grid{--gap:14px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--gap);max-width:1600px;margin:18px auto}
.item{background:var(--card);border-top:3px solid var(--label);border-radius:2px;padding:10px 8px 0;display:flex;flex-direction:column;align-items:center;min-height:124px;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:transform .12s,box-shadow .12s}
.item:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.18);border-top-color:var(--accent)}
.item .pic{position:relative;height:100px;width:100%;display:flex;align-items:center;justify-content:center}
.item img.w{max-width:100%;max-height:100px;object-fit:contain}
.item .noimg{font-size:11px;color:var(--sub)}
.tgl{display:none;flex-wrap:nowrap;gap:3px;justify-content:center;margin:0;padding:6px 6px 0;width:100%}
.tgl button{flex:1 1 0;min-width:0;height:18px;white-space:nowrap;font-size:8px;font-weight:500;line-height:1;padding:4px 1px;border:1px solid var(--accent);border-radius:4px;background:var(--card);color:var(--accent);cursor:pointer}
.tgl button.on{background:var(--accent);color:#fff;font-weight:600}
.foot{margin-top:auto;width:calc(100% + 16px);min-height:48px;display:flex;flex-direction:column;background:var(--label);color:var(--label-tx)}
.badges{position:absolute;left:8px;top:88px;display:flex;gap:4px;margin:0;min-height:0;z-index:1}   /* cố định góc dưới-trái vùng hình (top = 10px padding + 100px hình - 22px) */
.badges img{width:20px;height:20px;object-fit:contain}
.name{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;font-weight:600;padding:5px 4px;line-height:1.25}
.name>span{display:block;text-align:center}
.pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-size:13px;margin-top:10px}
.pager input{width:64px}
.pager .on{background:var(--accent);color:#fff;border-color:var(--accent)}
#tip{position:fixed;z-index:50;pointer-events:none;background:rgba(40,40,40,.94);color:#fff;border-radius:6px;padding:10px 14px;font-size:12.5px;line-height:1.7;display:none;max-width:420px}
#tip table{border-collapse:collapse}
#tip tr.rm td{color:#9a9a9a;text-decoration:line-through}
#tip s{text-decoration:line-through}
#tip .tip-ids{color:#fbdf89;font-weight:700;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(251,223,137,.35);word-break:break-all}
.name s{text-decoration:line-through}
/* ô tìm kiếm WEAPON LIST */
.cb{position:relative;flex:1 1 0;min-width:0}
.cb input{width:100%;padding-right:24px}
.cb .cbx{position:absolute;right:7px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--sub);display:none;font-size:17px;line-height:1}
.cb.has .cbx{display:block}
.cbl{position:fixed;z-index:60;display:none;max-height:320px;overflow-y:auto;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:13px}
.cbl div{padding:6px 10px;cursor:pointer;white-space:nowrap}
.cbl div.act,.cbl div[data-i]:hover{background:var(--accent);color:#fff}
.cbl div.none{color:var(--sub);cursor:default}
#tip td{vertical-align:top;padding:0 0 0 0}
#tip td:first-child{text-align:right;font-weight:700;padding-right:14px;white-space:nowrap}
/* ---- Popup chi tiết khi bấm vào vũ khí ---- */
#pop{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px}
#pop.on{display:flex}
#pop,#pop *{font-family:'Lexend',system-ui,sans-serif;font-weight:700}
#pop .pbox{position:relative;width:max-content;min-width:min(780px,100%);max-width:100%;max-height:92vh;overflow:auto;background:var(--card);color:var(--tx);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#pop .phd{background:var(--label);color:var(--label-tx);padding:16px 52px 16px 22px;font-size:18px;line-height:1.3}
#pop .px{position:absolute;top:12px;right:16px;font-size:22px;line-height:1;cursor:pointer;user-select:none;color:var(--label-tx)}
#pop .pbd{display:flex;flex-wrap:wrap;gap:24px;padding:20px 22px;align-items:center}
#pop .pleft{flex:1 1 300px;min-width:0}
#pop .ppic{height:200px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px}
#pop .ppic img.w{max-width:92%;max-height:170px;object-fit:contain}
#pop .ppic .noimg{font-size:12px;color:var(--sub)}
#pop .tgl{display:flex;flex-wrap:wrap;justify-content:center;padding:10px 0 0}
#pop .tgl button{flex:0 1 auto;height:auto;font-size:12px;padding:5px 12px}
#pop .preg{flex:1 1 260px;font-size:14px;line-height:1.9}
#pop .preg table{border-collapse:collapse}
#pop .preg td{vertical-align:top;padding:0;white-space:nowrap}
#pop .preg td:first-child{text-align:right;white-space:nowrap}
#pop .preg td.sep{padding:0 12px;color:var(--sub)}
#pop .preg tr.rm td{color:var(--sub);text-decoration:line-through}
#pop .preg s{text-decoration:line-through}
#pop .pyl{width:0;min-width:100%;box-sizing:border-box;background:#000;color:#fbdf89;padding:12px 22px;font-size:14px;line-height:1.7;text-align:left;word-break:break-all}
#pop .pyl .lb{color:#fff}
.item{cursor:pointer}
/* ---- Nút SCOPE (giống trang /skin/) ---- */
.scopebtn{position:absolute;right:-2px;bottom:6px;z-index:2;font-size:10px;line-height:1;padding:4px 9px;border:1px solid #8fa0cf;border-radius:3px;background:#2c3e75;color:#fff;font-weight:600;letter-spacing:.4px}
.scopebtn:hover{background:#3b52a0}
/* ---- Xem nhanh SCOPE khi rê chuột + cửa sổ phóng to khi bấm ---- */
#sp{position:fixed;z-index:60;pointer-events:none;display:none;width:240px;height:180px;background:var(--scope-bg);border:1px solid #555;box-shadow:0 6px 18px rgba(0,0,0,.45)}
#sp img{width:100%;height:100%;object-fit:contain;display:block}
#sp .noimg,#modal .noimg{color:#ccc;padding:14px;font-size:12px}
#modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center}
#modal.on{display:flex}
#modal .box{position:relative;width:min(800px,92vw,calc(80vh*4/3));aspect-ratio:4/3;background:var(--scope-bg)}
#modal .box img{width:100%;height:100%;object-fit:contain;display:block}
#modal .x{position:absolute;top:-38px;right:-2px;color:#fff;font:700 26px/1 'Lexend',sans-serif;cursor:pointer;user-select:none}
#msg{text-align:center;color:var(--sub);padding:30px;font-size:14px}
#msg.err{color:#d4380d}
#msg:empty,.ver:empty{display:none}   /* ẩn khoảng trống khi không có thông báo */
.grid{}@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<h1>Weapon</h1>
<div class="ver" id="ver">Đang tải dữ liệu…</div>

<div class="bar">
  <input type="text" id="q" placeholder="Tìm tên vũ khí (mọi khu vực)…">
  <button class="pri" id="btnSearch">Search</button>
  <button id="btnReset">Reset</button>
</div>
<div class="bar" id="filters"></div>

<div id="msg"></div>
<div class="grid" id="grid"></div>
<div class="pager" id="pager"></div>
<div id="tip"></div>
<div id="pop"><div class="pbox"><div class="phd" id="ptitle"></div><span class="px" id="pclose">&times;</span><div class="pbd"><div class="pleft"><div class="ppic" id="ppic"></div><div class="tgl" id="ptgl"></div></div><div class="preg" id="preg"></div></div><div class="pyl" id="pyl"></div></div></div>
<div class="cbl" id="cbl"></div>
<div id="sp"></div>
<div id="modal"><div class="box"><div id="mimg"></div><span class="x" id="mx">X</span></div></div>

<!-- data.js: giữ nguyên, không chỉnh sửa. Nếu file có khai báo SHEET_ID / SHEET_GID thì sẽ được dùng; nếu có mảng dữ liệu thì dùng làm dự phòng khi không tải được Sheet. -->
<script src="data.js" onerror="void 0"></script>
<script src="regions.js" onerror="void 0"></script>
<script>
/* ================= CẤU HÌNH ================= */
const CFG = {
  SHEET_ID : (typeof SHEET_ID  !== 'undefined' && SHEET_ID)  || '1GVgZrCybnuEdGPtVE33NMCmwRWSqfgLHIuz2XAXxhoc',
  GID      : (typeof SHEET_GID !== 'undefined' && SHEET_GID) || '2098056846',
  // Danh sách các tab (sheet) trong file Google Sheets sẽ được đọc và GỘP lại thành một. Mỗi tab phải có dòng 1 là tiêu đề, cột A–W giống nhau.
  // Mỗi phần tử là gid (dãy số trên URL sau #gid=) hoặc tên tab (ví dụ 'SNIPER'). Thêm tab mới chỉ cần thêm một dòng vào đây.
  // Cách 1 (khuyên dùng): tạo 1 tab tên "TABS" trong Sheet, cột A liệt kê tên các tab (mỗi tab 1 dòng, bắt đầu từ dòng 1, không có tiêu đề;
  // đặt dấu # đầu dòng để tạm tắt). Thêm tab mới chỉ cần thêm 1 dòng ở tab TABS, KHÔNG phải sửa file này.
  TAB_LIST: 'TABS',
  // Cách 2 (dự phòng nếu chưa có tab TABS): liệt kê tên tab hoặc gid ở đây.
  SHEETS: ['2098056846' , '953162863' , '1009811895' , '1975501148' /* RIFLE */ /*, 'SNIPER', 'SMG', 'SHOTGUN', 'MG' */],
  IMG_DIR  : 'img/',
  // ---- SCOPE ----
  // Hình scope: tìm trong weapon/img/SCOPE/ trước; không có thì tìm tiếp thư mục SCOPE của trang /skin/ (xoá dòng thứ 2 nếu chỉ muốn dùng weapon/img/SCOPE).
  // Ô cột F (SCOPE) ghi tên file scope, vd AWM_RedFrameHawk_Scope. Ô trống => tra SCOPE_DATA bên dưới theo mã cột B (IMAGE). Không có => không hiện nút SCOPE.
  SCOPE_DIRS: ['img/SCOPE/',
               '../skin/img/SCOPE/'],
  SCOPE_EXTS: ['.png','.webp','.jpg','.PNG'],
  // Hình có thể nằm trong thư mục con của Img/ (vd Img/RIFLE/, Img/SNIPER/). Trang tự thử: thư mục trùng với cột TYPE (C) / CATEGORIZED (D)
  // của dòng đó trước, rồi thư mục gốc Img/, rồi các thư mục trong danh sách dưới đây. Thêm tên thư mục mới vào đây nếu cần.
  IMG_SUBDIRS: ['RIFLE','SNIPER','SMG','SHOTGUN','MG','PISTOL','MELEE','GRENADE','FLASHBANG','SMOKE'],
  BADGE_DIR: 'img/badges/',
  IMG_PREFIX: 'BUYWEAPON_INFO',
  // Chỉ số cột (A=0). Đổi tại đây nếu sheet đổi cấu trúc.
  // Cột F = SCOPE (chèn sau WEAPON LIST) => CLASS/CLASS/SPECIAL/BADGES/khu vực lùi 1 cột: G,H,I,J, K–W
  COL: { name:0, image:1, c:2, d:3, e:4, scope:5, f:6, g:7, h:8, badges:9, regionFrom:10, regionTo:22 },
  // Nút đổi hình: lấy từ chính ô cột B. Ô có 1 tên => không có nút. Ô có 2+ tên (cách nhau bằng dấu , ; hoặc xuống dòng) => mỗi tên là 1 nút,
  // tất cả nằm chung thư mục Img/. Chữ trên nút: tìm luật trong VARIANT_RULES có đoạn tên (tokens) nằm trong tên file, nếu không thì dùng DEFAULT_LABELS theo thứ tự.
  // Gộp các dòng riêng thành 1 thẻ: tokens là đoạn tên file khác nhau giữa các biến thể ('' = bản gốc, không có đoạn đó).
  // Dòng nào có tên file chỉ khác nhau đúng đoạn này (cùng thư mục Img/) sẽ được gộp, thứ tự nút theo thứ tự tokens.
  GROUP_RULES: [],   // (không dùng nữa - gộp khung do VARIANT_RULES có merge:true đảm nhiệm)
  DEFAULT_LABELS: ['Normal','Change'],
  // Luật có merge:true sẽ GỘP nhiều dòng của Sheet thành 1 khung: các file chỉ khác nhau ở token (hoặc không có token = nút đầu/mặc định).
  VARIANT_RULES: [
    { match:'M249SPW', tokens:['','_Changemode','_Chg'], labels:['Normal','Shoulder Firing','Shoulder Firing'] },   // mọi khẩu M249 SPW có 2 chế độ
    { match:'M249SPW', tokens:['','_Changemode','_Chg'], labels:['Normal','Change Mode','Change Mode'] },   // mọi M249 SPW có 2 hình (Urban, Unyielding Spirit...). match = chỉ áp dụng cho tên hình có chứa đoạn này
    { tokens:['DualUZI-Gold','DualUZI-Gold_2'], labels:['World','Vietnam'] },
    { tokens:['RifleBeast','KnifeBeast'], labels:['Default','Change Mode'] },
    { tokens:['BaiHu_VN26_NM','BaiHu_VN26'], labels:['Original','Virtus.Pro'] },
    { tokens:['Dominator_VN26_nm','Dominator_VN26'], labels:['Original','Twisted Minds'] },
    { tokens:['AWM-GOLD','AWM_GOLD'], labels:['World','JP/KR'] },
    { tokens:['BurningShot','BurningShot_Charge'], labels:['Normal','Charged'] },
    { tokens:['','_DrumMag'], labels:['Normal','Drum Magazine'], merge:true },
    { tokens:['','_Dmag'], labels:['Normal','Drum Magazine'], merge:true },
    { tokens:['','_Drum'], labels:['Normal','Drum Magazine'], merge:true },
    { tokens:['_Rifle','_Knife'], labels:['Gun','Knife'] },
    { tokens:['','_Carbine'], labels:['Default','Carbine'] },
    { tokens:['_GSpirit', '_GSpirit_Changemode'],         labels:['Normal','Change Mode'] },
    { tokens:['','_Changemode'], labels:['Normal','Dual'] },
    { tokens:['_Protocol','_Protocol_Chg'], labels:['Normal','Change Mode'] },
    { tokens:['_UnderTech','_UnderTech_Chg'], labels:['Normal','Change Mode'] },
    { tokens:['_UT','_UT_Chg'], labels:['Normal','Change Mode'] },
    { tokens:['M200_DemonicBeast','M200_DemonicBeast_Chg','M200_DemonicBeast_PVE'], labels:['PVP','PVE','PVE Charged'] },
    { tokens:['','_Chg'], labels:['Normal','Dual'] },
    { tokens:['','_DMR'], labels:['Normal','DMR'] },
    { tokens:['','_Change'], labels:['Default','Change'] },
    { tokens:['','_spear','_wheel'], labels:['PVP','Spear','Wheel'] },
    { tokens:['9A91_WildEagle','9A91_WildEagle_Silencer','9A91_WildEagle_Scope','9A91_WildEagle_ExtendMag'], labels:['Default','Silencer','Scope','Ext. Mag'], },
    { tokens:['_XS_1','_XS_2'], labels:['Grip','No Grip'] },
    // { tokens:['','_NT'],               labels:['regular','De-sign'] },   // hậu tố: ví dụ _NT thêm cuối tên file
    // { tokens:['_A','_B','_C'],         labels:['Một','Hai','Ba'] },     // 3 nút
  ],
  CLOSED_REGIONS: ['Russia','Indonesia','Korea','South Korea','Español','Europe','SEA','Japan','Taiwan'],   // khu vực đã ngừng hoạt động: mọi dữ liệu của cột này bị gạch ngang + xám. Hoặc ghi "Russia (Removed)" ngay tiêu đề cột trong Sheet.
  CLOSED_FROM: 15,   // chỉ tiêu đề cột P (=15) trở đi (P–W) mà bị gạch ngang trong Sheet mới tính là khu vực đóng "(Closed)"
  REMOVED_WORDS: ['Removed','Closed'],   // từ đánh dấu ngừng hoạt động trong ô khu vực (thêm từ khác nếu cần, vd 'Đã gỡ')
  POPUP_REGIONS: ['China','Vietnam','Brazil','West','Philippines'],   // 5 dòng khu vực trong popup (đúng tên cột khu vực trong Sheet)
  HOVER_TIP: false,   // true = bật lại tooltip khu vực khi rê chuột vào thẻ
  PER_PAGE: 20,
  // Menu CLASS (cột F → G) và SPECIAL (cột H). Sửa tại đây nếu cần.
  CLASS_LABEL: 'CLASS',
  CLASS_MENU: [                            // thứ tự menu CLASS
    {text:'ALL',type:'all'},                 // xoá hết bộ lọc (như Reset)
    {text:'NORMAL'},                         // lọc cột F = NORMAL
    {text:'VVIP',kidsKw:['VVIP','INFINITY','NON-VVIP']},  // cột F = VVIP, mũi tên → nhận diện từ khoá ở cột G
    {text:'SVIP'},                           // lọc cột F = SVIP
    {text:'NON-VVIP',type:'kw'},             // mọi vũ khí có chữ NON-VVIP ở cột F hoặc G
    {text:'NOBLE GOLD',kids:['VVIP','NON-VVIP']},  // cột F = NOBLE GOLD, mũi tên → cột G
    {text:'FIGURINE'}                        // lọc cột F = FIGURINE
  ],
  SPECIAL_LABEL: 'SPECIAL',
  SPECIAL_BADGES: { BOLT:['PVE','NANO'] },  // mục BOLT chỉ hiện vũ khí có ĐỦ các thẻ này ở cột I (xoá dòng này nếu không cần)
  SPECIAL_KEYS: ['PVE','NANO','BOLT'],     // lọc ô cột H có chứa từ khoá
  // Khoá Google Sheets API (miễn phí) - cần nếu muốn (1) web nhận định dạng GẠCH NGANG thật của ô (cột J–V) và (2) bộ lọc "Create a filter" trong Sheet KHÔNG làm mất dòng trên web.
  // Có khoá thì web đọc toàn bộ dữ liệu bằng Sheets API (bỏ qua bộ lọc). Không có khoá thì đọc qua gviz: dòng bị bộ lọc ẩn sẽ không hiện (dùng "Filter views" thì không sao).

  API_KEY: '',

/* ================= TẢI SHEET (JSONP, chạy được cả file:// ) ================= */
let __gsN=0;
function loadSheet(ref,headers){
  return new Promise((resolve,reject)=>{
    const cb='__gs'+(++__gsN)+'_'+Date.now();
    const s=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();reject(new Error('Hết thời gian chờ. Kiểm tra Sheet đã chia sẻ "Anyone with the link – Viewer" chưa.'))},12000);
    function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}
    window[cb]=r=>{cleanup();r&&r.status==='ok'?resolve(r.table):reject(new Error('Tab '+ref+' lỗi: '+JSON.stringify(r&&r.errors||r)))};
    s.onerror=()=>{cleanup();reject(new Error('Tab '+ref+': không tải được (chưa public, sai tên/gid hoặc mất mạng).'))};
    s.src=`https://docs.google.com/spreadsheets/d/${CFG.SHEET_ID}/gviz/tq?${/^\d+$/.test(String(ref).trim())?'gid='+String(ref).trim():'sheet='+encodeURIComponent(ref)}&headers=${headers===0?0:1}&tqx=out:json;responseHandler:${cb}&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}
const cellStr=c=>c==null||c.v==null?'':String(c.f!=null&&typeof c.v==='number'?c.f:c.v).trim();

function parseTable(t){
  let headers=t.cols.map(c=>(c.label||'').trim());
  let rows=t.rows.map(r=>{const a=[];for(let i=0;i<t.cols.length;i++)a.push(cellStr(r.c&&r.c[i]));return a});
  if(headers.every(h=>!h)&&rows.length){headers=rows.shift()}
  return {headers,rows};
}

/* ===== Đọc định dạng gạch ngang thật bằng Google Sheets API (gviz không trả về định dạng) ===== */
function cellSegs(c){
  if(!c||c.formattedValue==null||c.formattedValue==='')return null;
  const t=String(c.formattedValue),tf=c.effectiveFormat&&c.effectiveFormat.textFormat;
  const whole=!!(tf&&tf.strikethrough),runs=c.textFormatRuns;
  if(!runs||!runs.length)return normSegs([{t,s:whole}]);
  const a=[];
  if((runs[0].startIndex||0)>0)a.push({t:t.slice(0,runs[0].startIndex),s:whole});
  runs.forEach((ru,i)=>{
    const b=i+1<runs.length?(runs[i+1].startIndex||0):t.length;
    const f=ru.format&&ru.format.strikethrough;
    a.push({t:t.slice(ru.startIndex||0,b),s:f!=null?!!f:whole});
  });
  return normSegs(a);
}
async function loadStrikes(refs){
  const base='https://sheets.googleapis.com/v4/spreadsheets/'+CFG.SHEET_ID,key='key='+encodeURIComponent(CFG.API_KEY);
  const j=async u=>{const r=await fetch(u),d=await r.json();if(d.error)throw new Error(d.error.message);return d};
  const meta=await j(base+'?fields=sheets.properties(sheetId,title)&'+key);
  const props=meta.sheets.map(s=>s.properties);
  const titles=refs.map(ref=>{ref=String(ref).trim();const p=/^\d+$/.test(ref)?props.find(x=>String(x.sheetId)===ref):props.find(x=>x.title.toLowerCase()===ref.toLowerCase());return p?p.title:null});
  const want=[...new Set(titles.filter(Boolean))];
  if(!want.length)return refs.map(()=>null);
  const last=String.fromCharCode(65+CFG.COL.regionTo);
  const ranges=want.map(t=>'ranges='+encodeURIComponent("'"+t.replace(/'/g,"''")+"'!A:"+last)).join('&');
  const fields='sheets(properties(title),data(rowData(values(formattedValue,effectiveFormat(textFormat(strikethrough)),textFormatRuns))))';
  const d=await j(base+'?includeGridData=true&'+ranges+'&fields='+encodeURIComponent(fields)+'&'+key);
  const byTitle={};
  d.sheets.forEach(s=>{byTitle[s.properties.title]=(s.data&&s.data[0]&&s.data[0].rowData)||[]});
  return titles.map(t=>t?byTitle[t]||null:null);
}
/* Sheets API trả về TOÀN BỘ dòng (kể cả dòng đang bị bộ lọc "Create a filter" ẩn), còn gviz thì bỏ các dòng bị lọc ẩn.
   Nên khi có API_KEY, dữ liệu được đọc thẳng từ API => bật/tắt bộ lọc trong Sheet không làm mất dòng trên web. */
function apiTable(api){
  const L=CFG.COL.regionTo+1,fv=c=>c&&c.formattedValue!=null?String(c.formattedValue).trim():'';
  const get=rw=>{const v=(rw&&rw.values)||[],a=[];for(let i=0;i<L;i++)a.push(fv(v[i]));return a};
  return {headers:get(api[0]),rows:api.slice(1).map(get).filter(r=>r.some(x=>x))};
}
function applyStrikes(rows,api){
  if(!api)return null;
  const hs=new Set(),h0=(api[0]&&api[0].values)||[];
  for(let i=CFG.CLOSED_FROM;i<=CFG.COL.regionTo;i++)if(cellSegs(h0[i]))hs.add(i);   // dòng 1 = tiêu đề: cột nào gạch ngang = khu vực đã đóng
  const C=CFG.COL,fv=c=>c&&c.formattedValue!=null?String(c.formattedValue).trim():'';
  const q=new Map();
  api.forEach((rw,i)=>{if(!i)return;const v=rw.values||[],k=fv(v[C.name])+'\u0001'+fv(v[C.image]);if(!q.has(k))q.set(k,[]);q.get(k).push(v)});
  rows.forEach(r=>{                                   // ghép dòng theo (cột A + cột B), theo thứ tự xuất hiện
    const l=q.get(r[C.name]+'\u0001'+r[C.image]);if(!l||!l.length)return;
    const v=l.shift(),st={};
    for(let i=C.regionFrom;i<=C.regionTo;i++){const sg=cellSegs(v[i]);if(sg)st[i]=sg}
    r.strike=st;
  });
  return hs;
}

/* Ô khu vực: ghi "Removed" (một mình, hoặc kèm tên: "Юбилей Removed", "Tên (Removed)", "Tên | Removed").
   - chỉ ghi Removed  => dùng tên ở cột A, gạch ngang + xám
   - kèm tên          => hiện tên đó, gạch ngang + xám */
const RM_RE=new RegExp('(^|[^\\p{L}\\p{N}])(?:'+CFG.REMOVED_WORDS.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\p{L}\\p{N}])','giu');
function parseReg(v,name){
  v=String(v||'').trim();
  if(!v)return {text:'',removed:false};
  let removed=false;
  let t=v.replace(RM_RE,(m,pre)=>{removed=true;return pre});
  if(removed){
    t=t.replace(/\(\s*\)|\[\s*\]/g,'').replace(/^[\s|;,:\-–—]+|[\s|;,:\-–—]+$/g,'').trim();
    if(!t){ return {text:name||'',disp:v,removed:true}; }
  }
  return {text:t,removed};
}
/* ===== Chữ GẠCH NGANG ở cột khu vực (J–V) =====
   Nguồn 1: định dạng gạch ngang thật trong Google Sheets (đọc qua Sheets API, cần CFG.API_KEY) -> r.strike[cột] = các đoạn {t,s}
   Nguồn 2: chữ gạch ngang kiểu Unicode (ký tự + U+0336 / U+0335) dán thẳng vào ô */
function normSegs(a){
  const o=[];
  a.forEach(x=>{if(!x.t)return;const l=o[o.length-1];if(l&&l.s===x.s)l.t+=x.t;else o.push({t:x.t,s:x.s})});
  if(!o.length)return null;
  o[0].t=o[0].t.replace(/^\s+/,'');o[o.length-1].t=o[o.length-1].t.replace(/\s+$/,'');
  const r=o.filter(x=>x.t);
  return r.some(x=>x.s)?r:null;
}
function uniSegs(v){
  const a=[];
  for(const ch of [...v]){
    if(ch==='\u0335'||ch==='\u0336'){if(a.length)a[a.length-1].s=true;continue}
    a.push({t:ch,s:false});
  }
  return {t:a.map(x=>x.t).join(''),sg:normSegs(a)};
}
function regCell(r,i){
  let v=String(r[i]||''),sg=(r.strike&&r.strike[i])||null;
  if(/[\u0335\u0336]/.test(v)){const u=uniSegs(v);v=u.t;if(!sg)sg=u.sg}
  return {v,sg};
}
const segHTML=sg=>sg.map(x=>x.s?`<s>${esc(x.t)}</s>`:esc(x.t)).join('');
const regHTML=(r,i)=>{const sg=r.segs&&r.segs[i];return sg?segHTML(sg):esc((r.disp&&r.disp[i])||r.reg[i])};

function build(headers,rows){
  H=headers;
  const C=CFG.COL;
  REGIONS=[];
  for(let i=C.regionFrom;i<=C.regionTo&&i<headers.length;i++) {
    let raw=headers[i]||('Region '+(i-C.regionFrom+1));
    const uni=/[\u0335\u0336]/.test(raw);if(uni)raw=uniSegs(raw).t;      // tiêu đề gạch ngang kiểu Unicode
    const ph=parseReg(raw,'');
    const name=ph.removed?(ph.text||raw):raw;
    const byList=CFG.CLOSED_REGIONS.some(w=>w.toLowerCase()===name.trim().toLowerCase());
    // đóng cửa = tiêu đề cột bị gạch ngang trong Sheet (nếu đọc được), hoặc ghi "Removed"; chưa đọc được định dạng thì dùng danh sách CLOSED_REGIONS
    REGIONS.push({idx:i,name,closed:ph.removed||uni||(HDR_STRIKE?HDR_STRIKE.has(i):byList)});
  }
  ROWS=rows.filter(r=>r[C.name]||r[C.image]).map(r=>({
    raw:r,
    name:r[C.name],
    ...(x=>({imgs:x,img:x[0]||''}))((r[C.image]||'').split(/[,;\n|]+/).map(t=>t.trim()).filter(Boolean)),
    scope:scopeOf(r,(r[C.image]||'').split(/[,;\n|]+/).map(t=>t.trim()).filter(Boolean)),
    badges:(r[C.badges]||'').split(/[,;\n|]+/).map(x=>x.trim()).filter(Boolean),
    ...(rc=>{
      const p=rc.map(c=>parseReg(c.v,r[C.name]));
      const segs=rc.map((c,k)=>c.sg&&c.sg.map(x=>x.t).join('')===p[k].text?c.sg:null);   // chỉ dùng khi chữ khớp hoàn toàn
      return {reg:p.map(x=>x.text),disp:p.map(x=>x.disp),segs,
        rm:p.map((x,k)=>x.removed||(REGIONS[k].closed&&!!x.text)||!!(segs[k]&&segs[k].every(z=>z.s)))};   // gạch ngang toàn ô => xám + gạch
    })(REGIONS.map(g=>regCell(r,g.idx)))
  }));
  ALLROWS=ROWS;
  ROWS=mergeGroups(ROWS);
}

/* Gộp nhiều dòng (Default / Silencer / Scope ...) thành 1 thẻ có nút bấm, theo GROUP_RULES */
function mergeGroups(rows){
  const rules=CFG.GROUP_RULES||[];
  if(!rules.length)return rows;
  const buckets=new Map(),info=new Map();
  rows.forEach(r=>{
    if(!r.img)return;
    const base=normBase(r.img);
    for(let ri=0;ri<rules.length;ri++){
      const T=rules[ri].tokens;
      let bi=-1,len=-1;
      T.forEach((t,j)=>{if(t&&base.includes(t)&&t.length>len){bi=j;len=t.length}});
      if(bi<0){bi=T.indexOf('');if(bi<0)continue}
      const stem=T[bi]?base.replace(T[bi],''):base;
      const key=ri+'|'+stem.toLowerCase();
      if(!buckets.has(key))buckets.set(key,new Map());
      const bk=buckets.get(key);
      if(!bk.has(bi)){bk.set(bi,{row:r,bi,base,ri});info.set(r,key)}
      return;
    }
  });
  const out=[],done=new Set();
  rows.forEach(r=>{
    const key=info.get(r);
    if(!key){out.push(r);return}
    const bk=buckets.get(key);
    if(bk.size<2){out.push(r);return}
    if(done.has(key))return;
    done.add(key);
    const ms=[...bk.values()].sort((a,b)=>a.bi-b.bi).map(m=>({row:m.row,base:m.base,label:rules[m.ri].labels[m.bi]||('#'+(m.bi+1))}));
    out.push({...ms[0].row,members:ms});
  });
  return out;
}

function imgDirs(row){
  const hint=row&&row.raw?[row.raw[CFG.COL.c],row.raw[CFG.COL.d]].map(x=>(x||'').trim()).filter(Boolean):[];
  const clean=x=>x.replace(/[\/]+$/,'');
  const sub=[...hint,...CFG.IMG_SUBDIRS].map(clean).filter(Boolean).map(d=>CFG.IMG_DIR+d+'/');
  const first=hint.length?sub.slice(0,hint.length):[];
  return [...new Set([...first,CFG.IMG_DIR,...sub])];
}
function weaponSrcList(v,row){
  if(!v) return [];
  let n=v.split(/[\/]/).pop().trim();
  const m=n.match(/\.(png|jpg|jpeg|webp)$/i);
  const ext=m?m[0]:'';
  let base=ext?n.slice(0,-ext.length):n;
  if(!base.toUpperCase().startsWith(CFG.IMG_PREFIX)) base=CFG.IMG_PREFIX+'_'+base;
  const exts=[...new Set(ext?[ext,'.PNG','.png']:['.PNG','.png','.jpg'])];
  return imgDirs(row).flatMap(d=>exts.map(e=>d+base+e));
}
function badgeSrcList(v){
  let n=v.split(/[\\/]/).pop().replace(/\.(png|jpg|jpeg|webp)$/i,'').trim();
  n=n.replace(/^tag_/i,'');

}

/* ===== Khớp tên file KHÔNG phân biệt hoa/thường (Cloudflare phân biệt, Windows thì không) =====
   manifest.json do build-manifest.js tự tạo khi Cloudflare build: { "đường/dẫn/viết/thường": "Đường/Dẫn/Thật" } */
let MAN={};
const FIXU=u=>{try{const k=decodeURIComponent(u).toLowerCase();return MAN[k]||u}catch(e){return u}};
const FIXL=l=>[...new Set(l.map(FIXU))];
async function loadManifest(){try{const r=await fetch('manifest.json?_='+Date.now());if(r.ok)MAN=await r.json()}catch(e){}}
function imgTag(list,cls,alt){

}

/* ================= NÚT ĐỔI HÌNH (theo ô cột B) ================= */
function normBase(v){
  let n=v.split(/[\\/]/).pop().trim().replace(/\.(png|jpg|jpeg|webp)$/i,'');
  if(!n.toUpperCase().startsWith(CFG.IMG_PREFIX)) n=CFG.IMG_PREFIX+'_'+n;
  return n;
}
// Steyr TMP có 3-4 mã ở cột B: theo thứ tự trái -> phải: Normal, Dual, Mutation[, Charged] (3 mã mà mã thứ 3 là AWM/Charge => Normal, Dual, Charged)
function tmpLabels(name,bases){
  if(/gatling\s*gun/i.test(name||'')&&/wild\s*shot/i.test(name)&&bases.length===2)return ['Normal','PVE Charged'];   // Gatling Gun-Wild Shot (2 mã): Normal, PVE Charged
  if(/\bp90\b/i.test(name||'')){   // P90-Frenzy (2 mã): PVP, PVE | P90-Wild Shot (4 mã): PVP, PVP Dual, PVE, PVE Charged
    if(/frenzy/i.test(name)&&bases.length===2)return ['PVP','PVE'];
    if(/wild\s*shot/i.test(name)&&bases.length===4)return ['PVP','PVP Dual','PVE','PVE Charged'];
  }
  if(!/\btmp\b/i.test(name||'')||bases.length<3||bases.length>4)return null;
  if(bases.length===4)return ['Normal','Dual','Mutation','Charged'];
  return ['Normal','Dual',/AWM|Charge/i.test(bases[2])?'Charged':'Mutation'];
}
function variantInfo(r){
  if(r.members) return {bases:r.members.map(m=>m.base),labels:r.members.map(m=>m.label),rows:r.members.map(m=>m.row)};
  if(!r.imgs||r.imgs.length<2) return null;
  const bases=r.imgs.map(normBase);
  const tl=tmpLabels(r.name,bases); if(tl)return {bases,labels:tl};
  const has=(ru,b)=>ru.tokens.some(t=>t&&b.includes(t));
  const rule=CFG.VARIANT_RULES.find(ru=>(!ru.match||bases.some(b=>b.toLowerCase().includes(ru.match.toLowerCase())))&&bases.some(b=>has(ru,b)));   // luật đứng trước được ưu tiên
  const labels=bases.map((b,k)=>{
    if(rule){
      let bi=-1,len=-1;
      rule.tokens.forEach((t,j)=>{if(t&&b.includes(t)&&t.length>len){bi=j;len=t.length}});
      if(bi<0)bi=rule.tokens.indexOf('');
      if(bi>=0&&rule.labels[bi])return rule.labels[bi];
    }
    return CFG.DEFAULT_LABELS[k]||('#'+(k+1));
  });
  return {bases,labels};
}
const allRemoved=row=>{const a=row.reg.map((v,i)=>v?row.rm[i]:null).filter(x=>x!==null);return a.length>0&&a.every(Boolean)};   // mọi khu vực có dữ liệu đều Removed
const removedIn=row=>{const g=F.region==null?-1:F.region;return g>=0?!!row.rm[g]:allRemoved(row)};
function titleOf(row){
  return row.name;   // luôn hiện Weapon Name (cột A), dù chọn khu vực nào
}
function titleHTML(row){
  return esc(row.name);
}
function buildEntries(list){
  const mrules=CFG.VARIANT_RULES.map((ru,ri)=>({ru,ri})).filter(x=>x.ru.merge);
  if(!mrules.length)return list.map(row=>({row}));
  const byKey=new Map(),of=new Map();
  list.forEach(row=>{
    if(!row.img)return;
    const base=normBase(row.img);
    for(const {ru,ri} of mrules){
      let j=-1,len=-1;
      ru.tokens.forEach((t,k)=>{if(t&&base.includes(t)&&t.length>len){j=k;len=t.length}});
      if(j<0)continue;
      const stem=base.replace(ru.tokens[j],'').toLowerCase(),key=ri+'|'+stem;
      let g=byKey.get(key);
      if(!g){g={ru,stem,members:[]};byKey.set(key,g)}
      if(g.members.some(m=>m.j===j))return;          // dòng trùng: để riêng
      g.members.push({row,j});of.set(row,g);
      return;
    }
  });
  // dòng mặc định (không chứa token) ghép vào nhóm cùng "stem"
  const defs=new Map();
  byKey.forEach(g=>{const e=g.ru.tokens.indexOf('');if(e>=0){if(!defs.has(g.stem))defs.set(g.stem,[]);defs.get(g.stem).push(g)}});
  list.forEach(row=>{
    if(of.has(row)||!row.img)return;
    const gs=defs.get(normBase(row.img).toLowerCase());if(!gs)return;
    const g=gs.find(x=>{const e=x.ru.tokens.indexOf('');return !x.members.some(m=>m.j===e)});
    if(!g)return;
    g.members.push({row,j:g.ru.tokens.indexOf('')});of.set(row,g);
  });
  const out=[],done=new Set();
  list.forEach(row=>{
    const g=of.get(row);
    if(!g||g.members.length<2){out.push({row});return}
    if(done.has(g))return;done.add(g);
    const m=g.members.slice().sort((a,b)=>a.j-b.j);
    out.push({row:m[0].row,members:m,ru:g.ru});
  });
  return out;
}

// Nhóm 1: C → D → E (TYPE/CATEGORIZED/WEAPON LIST) ; SCOPE (F) ; Nhóm 2: G → H → I (CLASS/CLASS/SPECIAL) ; Badges (J) ; Khu vực (K–W)
const GROUPS=[
  {key:'g1',cols:[CFG.COL.c,CFG.COL.d,CFG.COL.e]},
  {key:'g2',cols:[CFG.COL.f,CFG.COL.g,CFG.COL.h]}
];
function uniq(arr){return [...new Set(arr.filter(Boolean))]}

function optionsFor(gi,level){
  const g=GROUPS[gi];
  let rows=ALLROWS;
  for(let l=0;l<level;l++){const v=F[g.key+l];if(v)rows=rows.filter(r=>r.raw[g.cols[l]]===v)}
  return uniq(rows.map(r=>r.raw[g.cols[level]]));
}
function fillSelect(sel,label,opts,cur){

/* ===== Ô tìm kiếm thay cho danh sách WEAPON LIST: gõ nhiều từ khoá (không phân biệt hoa/thường, dấu, khoảng trắng/gạch) =====
   Gõ tới đâu lọc lưới tới đó; bấm 1 gợi ý (hoặc ↑↓ + Enter) để chọn chính xác tên đó; dấu × để xoá. */
const cbl=$('cbl');let cbOwner=null,cbPick=null,cbShown=[];
const nz=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase();
const cp=x=>nz(x).replace(/[\s\-_.]+/g,'');
function kwMatch(text,kw){
  const n=nz(text),c=cp(text);
  return nz(kw).split(/\s+/).filter(Boolean).every(w=>n.includes(w)||c.includes(cp(w)));
}
const cbHide=()=>{cbl.style.display='none';cbOwner=null};
addEventListener('scroll',e=>{if(cbOwner&&e.target!==cbl)cbHide()},true);
addEventListener('resize',cbHide);
cbl.addEventListener('mousedown',e=>{
  e.preventDefault();
  const d=e.target.closest('[data-i]');
  if(d&&cbPick)cbPick(cbShown[+d.dataset.i]);
});
function makeCombo(gi,g,lv,col){
  const key=g.key+lv,wrap=document.createElement('div');
  wrap.className='cb';
  wrap.innerHTML='<input type="text" autocomplete="off" spellcheck="false"><span class="cbx" title="Xoá">×</span>';
  const inp=wrap.firstChild,clr=wrap.lastChild;inp.id=key;
  let opts=[],act=-1;
  const sync=()=>{inp.value=F[key]||F[key+'kw']||'';wrap.classList.toggle('has',!!inp.value)};
  const pick=v=>{F[key]=v;F[key+'kw']='';sync();cbHide();refreshCascade();state.page=1;render()};
  const show=()=>{
    const q=F[key]?'':inp.value;                         // đã chọn sẵn 1 tên -> hiện đủ danh sách
    cbShown=opts.filter(o=>!q.trim()||kwMatch(o,q));act=-1;
    cbOwner=inp;cbPick=pick;
    const r=inp.getBoundingClientRect();
    cbl.style.left=r.left+'px';cbl.style.top=(r.bottom+2)+'px';cbl.style.minWidth=Math.max(r.width,220)+'px';
    cbl.innerHTML=cbShown.length
      ?cbShown.slice(0,300).map((o,i)=>`<div data-i="${i}">${esc(o)}</div>`).join('')+(cbShown.length>300?`<div class="none">… còn ${cbShown.length-300} kết quả, gõ thêm để thu hẹp</div>`:'')
      :'<div class="none">Không có kết quả</div>';
    cbl.style.display='block';
  };
  const mark=()=>{[...cbl.querySelectorAll('[data-i]')].forEach((d,i)=>d.classList.toggle('act',i===act));const a=cbl.querySelector('.act');if(a)a.scrollIntoView({block:'nearest'})};
  inp.addEventListener('focus',()=>{show();inp.select()});
  inp.addEventListener('blur',()=>{if(cbOwner===inp)cbHide()});
  inp.addEventListener('input',()=>{F[key]='';F[key+'kw']=inp.value.trim();wrap.classList.toggle('has',!!inp.value);show();state.page=1;render()});
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();if(cbOwner!==inp)show();
      const n=Math.min(cbShown.length,300);if(!n)return;
      act=e.key==='ArrowDown'?(act+1)%n:(act<=0?n-1:act-1);mark();
    }else if(e.key==='Enter'){
      e.preventDefault();
      if(act>=0&&cbShown[act]!=null)pick(cbShown[act]);
      else if(cbShown.length===1&&cbOwner===inp)pick(cbShown[0]);
      else cbHide();
    }else if(e.key==='Escape')cbHide();
  });
  clr.addEventListener('mousedown',e=>{e.preventDefault();F[key]='';F[key+'kw']='';sync();cbHide();refreshCascade();state.page=1;render()});
  inp._refresh=()=>{
    inp.placeholder=H[col]||('Col '+(col+1));
    opts=optionsFor(gi,lv);
    if(F[key]&&!opts.includes(F[key]))F[key]='';
    sync();
  };
  return wrap;
}

   Mỗi nút = 1 menu; rê chuột vào mục có ▶ thì cấp con mở bên cạnh; bấm mục nào lọc theo mục đó. */

function makeTypeMenu(){
  const C=CFG.COL;
  const nodes=uniq(ALLROWS.map(r=>r.raw[C.c])).map(t=>{
    const rt=ALLROWS.filter(r=>r.raw[C.c]===t);
    return {text:t,sel:{g10:t,g11:'',g12:''},kids:uniq(rt.map(r=>r.raw[C.d])).map(c=>({
      text:c,sel:{g10:t,g11:c,g12:''},
      kids:uniq(rt.filter(r=>r.raw[C.d]===c).map(r=>r.raw[C.e])).map(w=>({text:w,sel:{g10:t,g11:c,g12:w}}))
    }))};
  });
  return makeFly(nodes,()=>F.g10?[F.g10,F.g11,F.g12].filter(Boolean).join(' › '):(H[C.c]||'TYPE'),
    sel=>Object.assign(F,sel,{g10kw:'',g11kw:'',g12kw:''}));
}
/* CLASS: ALL (xoá hết bộ lọc) · NORMAL · VVIP · SVIP · NON-VVIP (từ khoá ở cột F/G) · NOBLE GOLD ▶ VVIP / NON-VVIP
   Thứ tự & nội dung sửa tại CFG.CLASS_MENU. */
function makeClassMenu(){
  const C=CFG.COL,none={clsF:'',clsG:'',clsKw:'',clsGKw:''};
  const allF=uniq(ALLROWS.flatMap(r=>tok(r.raw[C.f]))),allG=uniq(ALLROWS.flatMap(r=>tok(r.raw[C.g])));
  const real=(list,name)=>list.find(x=>nz(x)===nz(name))||name;   // lấy đúng chữ hoa/thường như trong Sheet
  const nodes=CFG.CLASS_MENU.map(m=>{
    if(m.type==='all')return {text:m.text,sel:{reset:true}};
    if(m.type==='kw')return {text:m.text,sel:{...none,clsKw:m.text}};
    const f=real(allF,m.text);
    const n={text:m.text,sel:{...none,clsF:f}};
    if(m.kids)n.kids=m.kids.map(k=>{const g=real(allG,k);return {text:k,sel:{...none,clsF:f,clsG:g}}});
    if(m.kidsKw)n.kids=m.kidsKw.map(k=>({text:k,sel:{...none,clsF:f,clsGKw:k}}));   // cấp con nhận diện theo TỪ KHOÁ của cột G
    if(n.kids)n.must=true;   // mục có mũi tên (VVIP, NOBLE GOLD): bắt buộc chọn mục con, không chọn đơn
    return n;
  });
  return makeFly(nodes,()=>F.clsKw||[F.clsF,F.clsG||F.clsGKw].filter(Boolean).join(' › ')||CFG.CLASS_LABEL,
    sel=>{if(sel.reset){resetAll();return}Object.assign(F,sel)});
}
/* SPECIAL: cột H, lọc theo từ khoá PVE / NANO / BOLT */
function makeSpecialMenu(){
  const nodes=[{text:'ALL',sel:{spKw:''}},...CFG.SPECIAL_KEYS.map(k=>({text:k,sel:{spKw:k}}))];
  return makeFly(nodes,()=>F.spKw||CFG.SPECIAL_LABEL,sel=>Object.assign(F,sel));
}

function buildFilters(){
  cbHide();closeMenus();
  MENUS.length=0;document.querySelectorAll('.tm').forEach(x=>x.remove());
  const box=$('filters');box.innerHTML='';
  GROUPS.forEach((g,gi)=>{
    g.cols.forEach((col,lv)=>{
      if(col>=H.length)return;
      if(gi===0){if(lv===0)box.appendChild(makeTypeMenu());return}     // C → D → E nằm gọn trong menu xổ của TYPE
      if(gi===1){                                                       // F+G = CLASS ; H = SPECIAL
        if(lv===0)box.appendChild(makeClassMenu());
        else if(lv===2)box.appendChild(makeSpecialMenu());
        return;
      }
      const sel=document.createElement('select');
      sel.id=g.key+lv;sel.title=H[col]||'';
      sel.onchange=()=>{
        F[g.key+lv]=sel.value;
        for(let k=lv+1;k<g.cols.length;k++){F[g.key+k]='';F[g.key+k+'kw']=''}   // reset cấp con
        refreshCascade();state.page=1;render();
      };
      box.appendChild(sel);
    });
  });
  // Khu vực
  const sr=document.createElement('select');sr.id='fRegion';
  sr.innerHTML='<option value="-1">ALL REGIONS</option>'+REGIONS.map((r,i)=>`<option value="${i}"${r.closed?' style="color:#999"':''}>${esc(r.name)}${r.closed?' (Closed)':''}</option>`).join('');
  sr.onchange=()=>{F.region=+sr.value;if(F.region<0){F.unique=false;const u=$('fUnique');if(u)u.checked=false}   // ALL REGIONS = bỏ lọc khu vực
    state.page=1;render()};box.appendChild(sr);
  const lb=document.createElement('label');lb.className='chk';
  lb.innerHTML='<input type="checkbox" id="fUnique"> Exclusive distributor';
  lb.querySelector('input').onchange=e=>{F.unique=e.target.checked;state.page=1;render()};
  box.appendChild(lb);
  refreshCascade();
}
function refreshCascade(){
  GROUPS.forEach((g,gi)=>g.cols.forEach((col,lv)=>{
    const sel=$(g.key+lv);if(!sel)return;
    if(sel._refresh){sel._refresh();return}
    fillSelect(sel,H[col]||('Col '+(col+1)),optionsFor(gi,lv),F[g.key+lv]);
  }));
}
function resetAll(){
  Object.keys(F).forEach(k=>delete F[k]);
  F.region=-1;$('q').value='';
  buildFilters();$('fRegion').value='-1';$('fUnique').checked=false;
  state.page=1;render();
}

/* ================= LỌC & HIỂN THỊ ================= */
function filtered(){
  const q=$('q').value.trim().toLowerCase();
  const reg=F.region==null?-1:F.region;
  const pass=r=>{
    for(const g of GROUPS)for(let l=0;l<g.cols.length;l++){const v=F[g.key+l];if(v&&r.raw[g.cols[l]]!==v)return false;const kw=F[g.key+l+'kw'];if(kw&&!kwMatch(r.raw[g.cols[l]],kw))return false}
    const K=CFG.COL;
    if(F.clsKw&&!(kwHas(r.raw[K.f],F.clsKw)||kwHas(r.raw[K.g],F.clsKw)))return false;
    if(F.clsF&&!tok(r.raw[K.f]).includes(F.clsF))return false;
    if(F.clsG&&!tok(r.raw[K.g]).includes(F.clsG))return false;
    if(F.clsGKw&&!kwHas(r.raw[K.g],F.clsGKw))return false;   // từ khoá cột G (VVIP không khớp NON-VVIP)
    if(F.spKw){
      const need=CFG.SPECIAL_BADGES[F.spKw];
      const hit=need?need.every(k=>kwHas(r.raw[K.badges],k))                                  // BOLT: thẻ cột I phải có ĐỦ cả PVE và NANO
               :(kwHas(r.raw[K.h],F.spKw)||kwHas(r.raw[K.badges],F.spKw));                    // PVE / NANO: ô cột H hoặc thẻ cột I
      if(!hit)return false;
    }
    if(F.badge&&!r.badges.includes(F.badge))return false;
    if(reg>=0&&!r.reg[reg])return false;                  // có ở khu vực đang chọn
    if(reg>=0&&F.unique&&r.reg.some((x,i)=>i!==reg&&x))return false; // chỉ có ở khu vực này
    if(q&&![r.name,...r.reg].some(x=>x.toLowerCase().includes(q)))return false;
    return true;
  };
  return ROWS.filter(r=>r.members?r.members.some(m=>pass(m.row)):pass(r));
}
function render(){
  const list=buildEntries(filtered()),reg=F.region==null?-1:F.region;
  const per=state.per,pages=Math.max(1,Math.ceil(list.length/per));
  if(state.page>pages)state.page=pages;
  const slice=list.slice((state.page-1)*per,state.page*per);
  $('msg').textContent=list.length?'':'Không có vũ khí nào khớp bộ lọc.';
  $('msg').className='';
  $('grid').innerHTML=slice.map(en=>{
    const r=en.row;
    const title=titleOf(r);
    return `<div class="item${removedIn(r)?' rm':''}" data-i="${ROWS.indexOf(r)}">
      <div class="pic">${imgTag(weaponSrcList(r.img,r),'w',title)||'<div class="noimg">(no image)</div>'}${scopeBtn(r)}</div>
      <div class="foot">${(vi=>vi?`<div class="tgl" style="display:flex">${vi.labels.map((l,j)=>`<button class="${j?'':'on'}" data-j="${j}">${esc(l)}</button>`).join('')}</div>`:'<div class="tgl"></div>')(en.members?{labels:en.members.map(m=>en.ru.labels[m.j]||en.ru.tokens[m.j]||'#')}:variantInfo(r))}
      <div class="name"><span>${titleHTML(r)}</span></div></div>
      <div class="badges">${r.badges.map(b=>imgTag(badgeSrcList(b),'b',b)).join('')}</div>
      </div>`;
  }).join('');
  [...$('grid').children].forEach((el,k)=>{el._g=slice[k].members?slice[k]:null});
  // pager
  let p=`<button id="pPrev" ${state.page<=1?'disabled':''}>‹</button>`;
  const show=new Set([1,pages,state.page-1,state.page,state.page+1].filter(x=>x>=1&&x<=pages));
  let last=0;[...show].sort((a,b)=>a-b).forEach(x=>{if(x-last>1)p+='<span>…</span>';p+=`<button class="pg ${x===state.page?'on':''}" data-p="${x}">${x}</button>`;last=x});
  p+=`<button id="pNext" ${state.page>=pages?'disabled':''}>›</button>
    <span>Jump to</span><input type="number" min="1" max="${pages}" id="pj" value="${state.page}"><button id="pGo">Go</button>`;
  $('pager').innerHTML=p;
  $('pPrev').onclick=()=>{state.page--;render()};$('pNext').onclick=()=>{state.page++;render()};
  document.querySelectorAll('.pg').forEach(b=>b.onclick=()=>{state.page=+b.dataset.p;render()});
  $('pGo').onclick=()=>{state.page=Math.min(pages,Math.max(1,+$('pj').value||1));render()};
}

/* ================= TỰ ĐIỀN TÊN KHU VỰC TỪ "ITEMCFT WORLD" (weapon/regions.json) =================
   - Ô khu vực trong Sheet có chữ  => luôn dùng chữ trong Sheet (sửa tay trong Sheet là thắng).
   - Ô trống                       => tự lấy tên từ file Item??.csv của khu vực đó.
   - Ô ghi "-"                     => khu vực đó KHÔNG có vũ khí này, không tự điền.
   Cách nhận diện vũ khí: so tên các ô khu vực đã có (và cột A) với tên trong file CSV -> ra mã _ItemIndexInBute -> lấy tên ở khu vực khác.
   Nếu cùng 1 vũ khí có 2 dòng (vd bản Trung Quốc và bản _NM), dòng nào đã có tên ở khu vực đó thì dòng kia không bị điền thêm. */
const AUTO_NORM = s => String(s || '').normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
const AUTO_BLANK = /^[\s\-–—]+$/;

function autoFillRegions(headers, rows, data, opt) {
  opt = opt || {};
  const from = opt.from, to = opt.to, nameCol = opt.nameCol || 0, imgCol = opt.imgCol == null ? 1 : opt.imgCol;
  const regs = (data && data.regions) || {};
  // cột khu vực nào có dữ liệu CSV
  const cols = [];
  for (let i = from; i <= to && i < headers.length; i++) {
    const h = String(headers[i] || '').replace(/[̵̶]/g, '').trim().toLowerCase();
    const r = Object.keys(regs).find(k => k.toLowerCase() === h);
    if (r) cols.push({ i, r });
  }
  if (!cols.length) return { filled: 0, unresolved: 0 };
  // chỉ mục tên -> mã cho từng khu vực
  const idx = {};
  for (const { r } of cols) {
    const m = idx[r] = new Map();
    const al = (data.alias && data.alias[r]) || {};
    for (const [k, names] of Object.entries(regs[r]))
      for (const n of names.concat(al[k] || [])) for (const z of new Set([AUTO_NORM(n), AUTO_NORM(n.replace(/\s*[(\[][^)\]]*[)\]]\s*$/, ''))])) { if (!z) continue; if (!m.has(z)) m.set(z, new Set()); m.get(z).add(k) }
  }
  const cover = k => cols.reduce((s, { r }) => s + (regs[r][k] ? 1 : 0), 0);
  const val = (row, i) => String(row[i] == null ? '' : row[i]).replace(/[̵̶]/g, '').trim();

  // 1) tìm mã cho từng dòng
  const info = rows.map(row => {
    const score = new Map(), add = (k, w) => score.set(k, (score.get(k) || 0) + w);
    const ev = new Map(), mark = (k, r) => { if (!ev.has(k)) ev.set(k, new Set()); ev.get(k).add(r) };   // khu vực nào đã khớp với mã k
    const blocked = new Set();
    for (const { i, r } of cols) {
      const v = val(row, i);
      if (!v) continue;
      if (AUTO_BLANK.test(v)) { blocked.add(i); continue }
      const hit = idx[r].get(AUTO_NORM(v.replace(/\(?\b(removed|closed)\b\)?/gi, '')));
      if (hit) hit.forEach(k => { add(k, 3); mark(k, r) });   // tên đã ghi trong Sheet: tín hiệu mạnh nhất
    }
    // tên hình cột B (bỏ BUYWEAPON_INFO_) thường trùng tên nội bộ _NAME trong CSV (yếu hơn cột A vì 1 hình có thể dùng chung nhiều dòng)
    String(row[imgCol] || '').split(/[,;\n|]+/).map(t => t.trim().replace(/^.*?BUYWEAPON_INFO_/i, '')).filter(Boolean).forEach(im => {
      const hits = new Map();   // mã -> số khu vực khớp
      for (const { r } of cols) { const ks = new Set(); for (const z of [im, im.replace(/_(NM|RU|VN|BR|PH|WE|VNWE|CN|TW|JP|KR|ID|EU|ES|GC|SC|GL)$/i, '')]) { const h = idx[r].get(AUTO_NORM(z)); if (h) h.forEach(k => ks.add(k)) } ks.forEach(k => { hits.set(k, (hits.get(k) || 0) + 1); mark(k, r) }) }
      hits.forEach((c, k) => add(k, 1 + c * 0.1));
    });
    // tên cột A (thử thêm bản bỏ chữ biến thể, vd "AK47-B Victor Dragon" -> "AK47 Victor Dragon")
    const nm = String(row[nameCol] || '');
    for (const [z, w] of [[AUTO_NORM(nm), 2], [AUTO_NORM(nm.replace(/^(\S+?)-[A-Z]\s+/, '$1 ')), 1.2]]) {
      if (!z) continue;
      const hits = new Map();
      for (const { r } of cols) { const h = idx[r].get(z); if (h) h.forEach(k => { hits.set(k, (hits.get(k) || 0) + 1); mark(k, r) }) }
      if (hits.size) { hits.forEach((c, k) => add(k, w + c * 0.1)); break }
    }
    const keys = [...score.entries()].sort((x, y) => y[1] - x[1] || cover(y[0]) - cover(x[0]) || (+x[0]) - (+y[0])).map(x => x[0]);
    const best = keys.length ? score.get(keys[0]) : 0;
    return { keys: keys.filter(k => score.get(k) === best), all: keys, ev, blocked };
  });

  // 2) nhóm cặp dòng bản thường / bản _NM (tên hình chỉ khác đuôi _NM)
  const par = rows.map((_, n) => n), find = n => par[n] === n ? n : (par[n] = find(par[n]));
  const join = (a, b) => { a = find(a); b = find(b); if (a !== b) par[b] = a };
  const img0 = n => String(rows[n][imgCol] || '').split(/[,;\n|]+/)[0].trim().toLowerCase();
  const base = new Map();
  rows.forEach((_, n) => { const im = img0(n); if (im && !/_nm$/.test(im)) base.set(im, n) });
  rows.forEach((_, n) => { const im = img0(n); if (/_nm$/.test(im) && base.has(im.replace(/_nm$/, ''))) join(base.get(im.replace(/_nm$/, '')), n) });
  const groups = new Map();
  rows.forEach((_, n) => { const g = find(n); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(n) });

  let filled = 0, unresolved = 0;
  rows.forEach((row, n) => {
    const x = info[n];
    for (const i of x.blocked) row[i] = '';
    if (!x.keys.length) { unresolved++; return }
    const grp = groups.get(find(n));
    for (const { i, r } of cols) {
      if (val(row, i) || x.blocked.has(i)) continue;
      if (grp.length > 1) {
        if (grp.some(m => m !== n && (val(rows[m], i) || info[m].blocked.has(i)))) continue;   // dòng anh em đã có tên khu vực này
        const isNM = m => /_nm(\b|_|$)/i.test(String(rows[m][imgCol] || ''));
        const pref = grp.filter(m => r === 'China' ? !isNM(m) : isNM(m));
        if ((pref.length ? pref[0] : grp[0]) !== n) continue;
      }
      // mã chính; nếu khu vực này không có thì chỉ dùng mã phụ đã khớp tên NGAY TRONG khu vực này (tránh lấy nhầm vũ khí khác)
      const k = x.keys.find(k => regs[r][k]) || x.all.find(k => regs[r][k] && x.ev.get(k) && x.ev.get(k).has(r));
      if (!k) continue;
      row[i] = regs[r][k][0];
      (row.auto || (row.auto = new Set())).add(i);
      filled++;
    }
  });
  return { filled, unresolved };
}

let AUTO_DATA=null;
const AUTO_P=window.REGIONS_DATA?Promise.resolve(AUTO_DATA=window.REGIONS_DATA):CFG.AUTO_REGIONS?fetch(CFG.AUTO_REGIONS,{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(d=>AUTO_DATA=d).catch(()=>null):Promise.resolve(null);
async function applyAuto(headers,rows){
  await AUTO_P;
  if(!AUTO_DATA)return;
  try{
    const st=autoFillRegions(headers,rows,AUTO_DATA,{from:CFG.COL.regionFrom,to:CFG.COL.regionTo,nameCol:CFG.COL.name,imgCol:CFG.COL.image});
    console.log('[ITEMCFT] tự điền',st.filled,'ô; không nhận diện được',st.unresolved,'dòng; dữ liệu build lúc',AUTO_DATA.built);
  }catch(e){console.warn('[ITEMCFT] lỗi tự điền:',e)}
}
const AUTO_SHOW=CFG.AUTO_MARK||/[?&]auto\b/.test(location.search);

/* ================= KHỞI CHẠY (mỗi lần F5 tải lại Sheet) ================= */
$('btnSearch').onclick=()=>{state.page=1;render()};
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){state.page=1;render()}});
$('q').addEventListener('input',(()=>{let t;return()=>{clearTimeout(t);t=setTimeout(()=>{state.page=1;render()},200)}})());   // gõ tới đâu lọc tới đó, không cần bấm Search
$('btnReset').onclick=resetAll;

function dataJsFallback(){
  for(const k of ['DATA','data','WEAPONS','weapons','weaponData']){
    const v=window[k];
    if(Array.isArray(v)&&v.length&&Array.isArray(v[0]))return {headers:v[0].map(String),rows:v.slice(1).map(r=>r.map(x=>x==null?'':String(x)))};
  }
  return null;
}
(async function init(){
  try{
    await loadManifest();
    let refs=[];
    if(CFG.TAB_LIST){                                   // đọc danh sách tab từ tab "TABS" (nếu có)
      try{
        let col=null;
        if(CFG.API_KEY){try{const g=await loadStrikes([CFG.TAB_LIST]);if(g[0])col=g[0].map(rw=>{const c=rw&&rw.values&&rw.values[0];return c&&c.formattedValue!=null?String(c.formattedValue).trim():''})}catch(e){}}   // đọc bằng API: không bị bộ lọc
        if(!col){const t=await loadSheet(CFG.TAB_LIST,0);col=t.rows.map(r=>cellStr(r.c&&r.c[0]))}
        const names=col.filter(x=>x&&!x.startsWith('#')&&x.toLowerCase()!==CFG.TAB_LIST.toLowerCase());
        if(names.length&&names.length<=40)refs=[...new Set(names)];
      }catch(e){}
    }
    if(!refs.length)refs=(CFG.SHEETS&&CFG.SHEETS.length?CFG.SHEETS:[CFG.GID]).map(String);
    let ok=null,okIdx=[],bad=[],stNote='';
    if(CFG.API_KEY){                                    // có khoá API: đọc dữ liệu + gạch ngang trực tiếp bằng Sheets API (không bị bộ lọc ảnh hưởng)
      try{
        const g=await loadStrikes(refs),got=[];
        g.forEach((api,i)=>{if(api&&api.length)got.push({i,api})});
        if(!got.length)throw new Error('không tìm thấy tab');
        ok=got.map((x,k)=>{const t=apiTable(x.api),h=applyStrikes(t.rows,x.api);if(k===0&&h)HDR_STRIKE=h;return t});
        okIdx=got.map(x=>x.i);bad=refs.filter((_,i)=>!okIdx.includes(i));
      }catch(e){ok=null;stNote=' · Không đọc được bằng Sheets API ('+e.message+'), đang dùng cách đọc thường - dòng bị bộ lọc ẩn trong Sheet có thể không hiện'}
    }
    if(!ok){                                            // không có khoá API (hoặc API lỗi): đọc qua gviz như cũ
      const res=await Promise.allSettled(refs.map(r=>loadSheet(r)));
      okIdx=res.map((x,i)=>x.status==='fulfilled'?i:-1).filter(i=>i>=0);
      ok=okIdx.map(i=>parseTable(res[i].value));
      if(!ok.length)throw res[0].reason;
      bad=refs.filter((_,i)=>res[i].status==='rejected');
    }
    const seen=new Set();                               // bỏ dòng trùng hệt nhau (phòng khi 1 tab bị đọc 2 lần)
    const allRows=ok.flatMap(x=>x.rows).filter(r=>{const k=r.join('\u0001');if(seen.has(k))return false;seen.add(k);return true});
    await applyAuto(ok[0].headers,allRows);
    build(ok[0].headers,allRows);                       // gộp mọi tab, tiêu đề lấy từ tab đầu tiên
    $('ver').textContent=((bad.length?'KHÔNG đọc được tab: '+bad.join(', '):'')+stNote).replace(/^ · /,'');   // dòng thông tin thường đã ẩn; chỉ hiện khi có cảnh báo
  }catch(err){
    const fb=dataJsFallback();
    if(fb){await applyAuto(fb.headers,fb.rows);build(fb.headers,fb.rows);$('ver').textContent='Đang dùng dữ liệu dự phòng từ data.js ('+err.message+')'}
    else{$('ver').textContent='';$('msg').textContent=err.message;$('msg').className='err';return}
  }
  F.region=-1;buildFilters();render();
})();
</script>
