<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoangzii – Trang tổng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--text:#e8eaf0;--mute:#9aa1b2;--acc:#4da3ff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Lexend',system-ui,sans-serif;padding:48px 20px}
  .wrap{max-width:960px;margin:0 auto}
  h1{font-weight:600;font-size:28px;margin:0 0 6px}
  p.sub{color:var(--mute);margin:0 0 32px;font-weight:300}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;color:inherit;text-decoration:none;transition:.15s}
  a.card:hover{border-color:var(--acc);transform:translateY(-2px)}
  a.card b{display:block;font-size:18px;font-weight:500;margin-bottom:6px}
  a.card span{color:var(--mute);font-size:14px;font-weight:300}
</style>
</head>
<body>
<div class="wrap">
  <h1>Hoangzii</h1>
  <p class="sub">Tổng hợp các trang</p>
  <div class="grid">
    <!-- Thêm trang mới: copy nguyên 1 khối <a> dưới đây, đổi href, tiêu đề và mô tả -->
    <a class="card" href="/skin/">
      <b>Weapon Skin Guide</b>
      <span>Danh sách skin vũ khí CrossFire</span>
    </a>
    <a class="card" href="/weapon/">
      <b>Weapon Guide</b>
      <span>Danh sách vũ khí và tên theo khu vực</span>
    </a>
  </div>
</div>
</body>
</html>
