<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weapon Sets</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff;--card:#fff;--tx:#111;--head:#111;--blue:#1677ff;--blue-h:#0f63d9;--label:#99ccff;--label-tx:#0a2540;--line:#d9d9d9;--muted:#6b7785;--thumb:#fff;--shadow:0 6px 18px rgba(0,0,0,.18)}
  @media(prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f1f;--tx:#eee;--head:#eee;--blue:#4da3ff;--blue-h:#6ab4ff;--label:#1d3552;--label-tx:#e6f1ff;--line:#3a3f45;--muted:#9aa5b1;--thumb:#262626;--shadow:0 6px 18px rgba(0,0,0,.6)}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:'Lexend',system-ui,sans-serif;padding:36px 16px 60px}
  .wrap{max-width:1620px;margin:0 auto;padding:0 8px}
  h1{text-align:center;font-size:26px;font-weight:700;margin:0 0 14px;color:var(--head)}
  #status{color:var(--muted);font-size:13px;text-align:center;margin-bottom:14px}
  .tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
  #search{width:min(420px,100%);height:34px;padding:0 12px;border-radius:4px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:400 13px 'Lexend',sans-serif;outline:none}
  #search:focus{border-color:var(--blue)}
  .btn{height:34px;padding:0 14px;background:var(--card);border:1px solid var(--line);border-radius:4px;color:var(--tx);font:600 13px 'Lexend',sans-serif;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.primary:hover{background:var(--blue-h);border-color:var(--blue-h);color:#fff}
  #tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  #tabs button{height:34px;padding:0 16px;background:var(--card);border:1px solid var(--line);border-radius:4px;color:var(--tx);font:600 13px 'Lexend',sans-serif;cursor:pointer;transition:.15s}
  #tabs button:hover{border-color:var(--blue)}
  #tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .card{position:relative;display:block;width:100%;padding:0;background:var(--card);border:0;border-top:2px solid var(--blue);color:var(--label-tx);cursor:pointer;text-align:center;font:inherit;overflow:hidden;transition:.15s}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .thumb{position:relative;height:112px;display:flex;align-items:center;justify-content:center;background:var(--thumb)}
  .thumb img{max-width:82%;max-height:90px;object-fit:contain}
  .noimg{color:var(--muted);font-size:11px}
  .name{background:var(--label);color:var(--label-tx);padding:12px 8px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 12px 'Lexend',sans-serif;line-height:1.35}
  .count{font-weight:500;font-size:11px;opacity:.75;margin-top:2px}
  .badges{position:absolute;left:8px;bottom:6px;display:flex;gap:4px}
  .badges img{height:16px;width:auto;max-width:none;max-height:none}
  .badges.tr{left:auto;bottom:auto;right:6px;top:6px}   /* badge góc trên bên phải của thẻ set (cột C) */
  .badges.tr img{height:24px}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  #overlay.open{display:flex}
  #popup{background:var(--card);border-radius:8px;box-shadow:var(--shadow);width:min(1500px,100%);max-height:88vh;display:flex;flex-direction:column}
  .pophead{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
  #popup h2{margin:0;font-size:18px;font-weight:700;color:var(--head)}
  #close{background:none;border:0;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
  #close:hover{color:var(--tx)}
  #popbody{overflow:auto;padding:18px 20px 22px}
  /* tối đa 6 thẻ mỗi hàng (màn hình hẹp thì tự giảm số cột), chữ trong thẻ nhỏ hơn 1px */
  #popbody.grid{grid-template-columns:repeat(auto-fill,minmax(max(150px,calc((100% - 5*14px)/6)),1fr))}
  #popbody .name{font-size:11px}
  #popbody .noimg{font-size:10px}
  /* thẻ vũ khí trong popup: dùng đúng hiệu ứng hover như thẻ set (nhấc lên + đổ bóng), bấm để mở popup chi tiết */
  .item{cursor:pointer}
  /* popup chi tiết vũ khí (nằm trên popup set): ảnh + nút biến thể + tên theo khu vực (cột J–V) + mã ảnh */
  #doverlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
  #doverlay.open{display:flex}
  #dpop{background:var(--card);color:var(--tx);border-radius:8px;box-shadow:var(--shadow);width:min(780px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column}
  .dhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;background:var(--label);color:var(--label-tx)}
  .dhead h2{margin:0;font-size:18px;font-weight:700}
  #dclose{background:none;border:0;color:var(--label-tx);font-size:26px;cursor:pointer;line-height:1}
  .dmain{display:flex;flex-wrap:wrap;gap:24px;align-items:center;padding:20px 22px}
  .dleft{flex:0 0 376px;max-width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
  .dbox{width:100%;height:200px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;background:var(--thumb)}
  .dbox img{max-width:88%;max-height:170px;object-fit:contain}
  .dvars{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .vbtn{height:26px;padding:0 12px;background:var(--card);border:1px solid var(--blue);border-radius:4px;color:var(--blue);font:700 12px 'Lexend',sans-serif;cursor:pointer}
  .vbtn.on{background:var(--blue);color:#fff}
  .dregions{flex:1 1 220px;display:grid;grid-template-columns:auto auto 1fr;column-gap:12px;row-gap:10px;align-items:baseline;font:700 14px 'Lexend',sans-serif}
  .dregions .rg{text-align:right}
  .dregions .sp{color:var(--muted);font-weight:400}
  .dcodes{background:#000;color:#f3d98b;padding:14px 22px 16px;font:700 14px/1.7 'Lexend',sans-serif;word-break:break-all}
  .dcodes div.on{color:#fff7cf}
</style>
</head>
<body>
<div class="wrap">
  <h1>Weapon Sets</h1>
  <div id="status">Đang tải dữ liệu...</div>
  <div class="tools">
    <input id="search" type="search" placeholder="Tìm Weapon Sets">
    <button class="btn primary" id="go" type="button">Search</button>
    <button class="btn" id="reset" type="button">Reset</button>
  </div>
  <div id="tabs"></div>
  <div id="list" class="grid"></div>
</div>

<div id="overlay"><div id="popup">
  <div class="pophead"><h2 id="poptitle"></h2><button id="close" aria-label="Đóng">&times;</button></div>
  <div id="popbody" class="grid"></div>
</div></div>

<div id="doverlay"><div id="dpop">
  <div class="dhead"><h2 id="dtitle"></h2><button id="dclose" aria-label="Đóng">&times;</button></div>
  <div class="dmain">
    <div class="dleft"><div id="dimg" class="dbox"></div><div id="dvars" class="dvars"></div></div>
    <div id="dregions" class="dregions"></div>
  </div>
  <div id="dcodes" class="dcodes"></div>
</div></div>

<script>
/* ====== CẤU HÌNH — chỉ sửa phần này ====== */
const CONFIG = {
  SHEET_ID: '1GVgZrCybnuEdGPtVE33NMCmwRWSqfgLHIuz2XAXxhoc',   // phần giữa /d/ và /edit trong link sheet
  WEAPON_TABS: ['RIFLE','SNIPER','SMG','MG','SHOTGUN','PISTOL','MELEE','THROW'],
  // Tab WEAPON SETS:
  //   A: SET NAME  = tên set. Nếu cột B để trống thì vũ khí nào có tên (cột A các tab vũ khí) chứa tên set này sẽ thuộc set.
  //   B: điền tay, các mục cách nhau bằng , hoặc ; hoặc xuống dòng. Mỗi mục là 1 trong 2 dạng:
  //      - MÃ ĐẦY ĐỦ bắt đầu bằng BUYWEAPON_INFO_ (vd BUYWEAPON_INFO_Grenade_Abyssal): lấy đúng 1 ảnh đó
  //      - TỪ KHOÁ (vd Abyssal, 12CZS): lấy mọi vũ khí có tên (cột A tab vũ khí) hoặc mã ảnh (cột B tab vũ khí) chứa từ khoá
  //      Có thể trộn cả hai. Để trống thì dùng tên set (cột A) làm từ khoá.
  //   C: BADGE = từ khoá badge hiện ở góc TRÊN BÊN PHẢI thẻ set (vd VVIP). Để trống nếu không có.
  SETS_TAB: 'WEAPON SETS',
  // Ảnh vũ khí: dùng chung thư mục ảnh của trang /weapon/ (không cần cột ảnh riêng ở tab WEAPON SETS).
  // Cách tìm giống hệt trang Weapon: thêm tiền tố BUYWEAPON_INFO_ nếu thiếu, thử thư mục theo cột C/D của dòng vũ khí,
  // thư mục gốc img/, rồi các thư mục con bên dưới; thử cả đuôi .PNG/.png; khớp hoa/thường nhờ /weapon/manifest.json.
  WEAPON_BASE: location.protocol === 'file:' ? '../weapon/' : '/weapon/',   // mở file trực tiếp từ máy: ../weapon/ ; trên web: /weapon/
  IMG_DIR: 'img/',
  IMG_SUBDIRS: ['RIFLE','SNIPER','SMG','SHOTGUN','MG','PISTOL','MELEE','GRENADE','FLASHBANG','SMOKE'],
  IMG_PREFIX: 'BUYWEAPON_INFO',
  BADGE_DIR: 'img/badges/',   // thư mục badge (nằm trong thư mục weapon), file tag_<tên>.PNG như trang Weapon
  // Tên vũ khí theo khu vực (hiện trong popup chi tiết) — các cột J → V (số thứ tự bắt đầu từ 0: J=9 ... V=21) của MỌI tab vũ khí.
  // Tiêu đề cột (dòng 1) là tên khu vực.
  //   J → N (9..13)  : khu vực đang hoạt động, LUÔN hiện; ô trống hiện dấu "-"
  //   O → V (14..21) : dự phòng, chỉ hiện khi ô của vũ khí đó có dữ liệu (điền vào sheet là tự hiện)
  REGION_COL_FROM: 9,
  REGION_COL_ACTIVE_TO: 13,
  REGION_COL_TO: 21
  // Badge: từ khoá = tên file badge bỏ "tag_" và đuôi, vd tag_VVIP.PNG -> VVIP. Nhiều badge cách nhau bằng dấu , hoặc ;
};
/* ========================================= */

const $ = id => document.getElementById(id);
let SETS = [], WEAPONS = [], currentGroup = null;
let REGION_LABELS = [];   // tên các khu vực đang hoạt động (cột J–N) lấy từ tiêu đề sheet — dùng khi vũ khí chưa có trong tab vũ khí

function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ','){ row.push(cur); cur = ''; }
    else if (c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

/* Đọc Google Sheet bằng JSONP (thẻ <script>) — chạy được cả khi mở file trực tiếp từ ổ đĩa (file://), fetch thì bị chặn */
let __gsN = 0;
const cellStr = c => c == null || c.v == null ? '' : String(c.f != null && typeof c.v === 'number' ? c.f : c.v).trim();
function loadTab(name){
  return new Promise((resolve, reject) => {
    const cb = '__gs' + (++__gsN) + '_' + Date.now();
    const s = document.createElement('script');
    let timer;
    const cleanup = () => { clearTimeout(timer); delete window[cb]; s.remove(); };
    timer = setTimeout(() => { cleanup(); reject(new Error(name + ': hết thời gian chờ')); }, 15000);
    window[cb] = r => {
      cleanup();
      if (!r || r.status !== 'ok') return reject(new Error(name + ': ' + JSON.stringify((r && r.errors) || r)));
      const t = r.table;
      let labels = t.cols.map(c => (c.label || '').trim());
      const rows = t.rows.map(rw => t.cols.map((_, i) => cellStr(rw.c && rw.c[i])));
      if (labels.every(h => !h) && rows.length) labels = rows.shift().map(h => h.trim());
      const headers = labels.map(h => h.toUpperCase());
      resolve({rows, labels, badgeCol: headers.findIndex(h => h === 'BADGES' || h === 'BADGE')});
    };
    s.onerror = () => { cleanup(); reject(new Error(name + ': không tải được (sai tên tab, chưa chia sẻ hoặc mất mạng)')); };
    s.src = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(name)}&headers=1&tqx=out:json;responseHandler:${cb}&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}

/* Tên vũ khí theo khu vực: đọc cột J–V của 1 dòng; tiêu đề cột = tên khu vực (trống thì dùng chữ cái cột).
   Cột J–N (đang hoạt động): luôn hiện, ô trống hiện "-". Cột O–V (dự phòng): chỉ hiện khi ô có dữ liệu. */
const colLetter = n => { let s = ''; for (n++; n > 0; n = Math.floor((n - 1) / 26)) s = String.fromCharCode(65 + (n - 1) % 26) + s; return s; };
function regionsOf(r, labels){
  const out = [];
  for (let i = CONFIG.REGION_COL_FROM; i <= CONFIG.REGION_COL_TO; i++){
    const label = ((labels && labels[i]) || '').trim() || colLetter(i);
    const v = (r[i] || '').trim();
    if (i <= CONFIG.REGION_COL_ACTIVE_TO) out.push({region: label, name: v || '-'});
    else if (v) out.push({region: label, name: v});
  }
  return out;
}

function splitBadges(cell){
  return (cell || '').split(/[,;\n]+/).map(s => s.trim()).filter(Boolean);
}
/* Badge giống trang Weapon: img/badges/tag_<tên>.PNG (thử .PNG/.png, tên gốc/chữ thường) */
function badgeList(v){
  const n = v.split(/[\\/]/).pop().replace(/\.(png|jpg|jpeg|webp)$/i, '').trim().replace(/^tag_/i, '');
  const p = [];
  for (const e of ['.PNG', '.png']) for (const b of ['tag_' + n, 'tag_' + n.toLowerCase()]) p.push(CONFIG.WEAPON_BASE + fixPath(CONFIG.BADGE_DIR + b + e));
  return [...new Set(p)];
}
function badgesTag(list, cls){
  if (!list || !list.length) return '';
  return `<div class="badges${cls ? ' ' + cls : ''}">` + list.map(b => {
    const [first, ...rest] = badgeList(b);
    return `<img class="bd" src="${attr(first)}" alt="${attr(b)}" title="${attr(b)}" data-alts="${attr(JSON.stringify(rest))}" onerror="__fb(this)">`;
  }).join('') + '</div>';
}

/* Cột B của tab vũ khí: giống trang Weapon — tách bằng , ; | hoặc xuống dòng (tên file có thể chứa khoảng trắng, có hoặc không có tiền tố/đuôi) */
function splitCodes(cell){
  return (cell || '').split(/[,;\n|]+/).map(s => s.trim()).filter(Boolean);
}
const norm = s => (s || '').toLowerCase();
const esc  = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const attr = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

/* ===== Tìm ảnh (cùng cách với trang Weapon) ===== */
let MAN = {};   // manifest.json: { "đường/dẫn/viết/thường": "Đường/Dẫn/Thật" }
async function loadManifest(){
  if (location.protocol === 'file:') return;   // mở từ máy (Windows không phân biệt hoa/thường) nên không cần manifest
  try{ const r = await fetch(CONFIG.WEAPON_BASE + 'manifest.json?_=' + Date.now()); if (r.ok) MAN = await r.json(); }catch(e){}
}
const fixPath = p => { try{ return MAN[decodeURIComponent(p).toLowerCase()] || p; }catch(e){ return p; } };

function imgList(code, hints){
  if (!code) return [];
  const n = code.split(/[\\/]/).pop().trim();
  const m = n.match(/\.(png|jpg|jpeg|webp)$/i);
  const ext = m ? m[0] : '';
  let base = ext ? n.slice(0, -ext.length) : n;
  if (!base.toUpperCase().startsWith(CONFIG.IMG_PREFIX)) base = CONFIG.IMG_PREFIX + '_' + base;
  const exts = [...new Set(ext ? [ext, '.PNG', '.png'] : ['.PNG', '.png', '.jpg'])];
  const clean = x => x.replace(/[\/]+$/, '');
  const first = (hints || []).map(x => (x || '').trim()).filter(Boolean).map(x => CONFIG.IMG_DIR + clean(x) + '/');
  const sub = CONFIG.IMG_SUBDIRS.map(d => CONFIG.IMG_DIR + d + '/');
  const dirs = [...new Set([...first, CONFIG.IMG_DIR, ...sub])];
  const list = dirs.flatMap(d => exts.map(e => fixPath(d + base + e)));
  return [...new Set(list)].map(p => CONFIG.WEAPON_BASE + p);
}
window.__fb = img => {
  const list = JSON.parse(img.dataset.alts || '[]');
  const next = list.shift();
  if (next){ img.dataset.alts = JSON.stringify(list); img.src = next; }
  else if (img.classList.contains('bd')) img.remove();   // badge không tìm thấy thì ẩn
  else img.replaceWith(Object.assign(document.createElement('span'), {className:'noimg', textContent:'no image'}));
};

/* Mỗi mục ở cột B của tab WEAPON SETS có 2 dạng:
     1) MÃ ĐẦY ĐỦ, bắt đầu bằng BUYWEAPON_INFO_ (vd BUYWEAPON_INFO_Grenade_Abyssal): lấy đúng 1 ảnh đó, kể cả khi mã không có trong tab vũ khí nào
     2) TỪ KHOÁ (vd Abyssal, 12CZS): lấy mọi vũ khí có TÊN (cột A tab vũ khí, khớp theo từ nguyên vẹn) hoặc MÃ ẢNH (cột B tab vũ khí, khớp một phần) chứa từ khoá
   Cột B để trống thì dùng tên set (cột A của tab WEAPON SETS) làm từ khoá. */
const wordRe = t => new RegExp('(^|[^a-z0-9])' + esc(norm(t)) + '([^a-z0-9]|$)');
const isFullCode = s => /^buyweapon_info_/i.test(String(s || '').split(/[\\/]/).pop().trim());
function kwMatch(k, w){
  const kn = norm(k).trim();
  if (!kn) return false;
  return wordRe(k.trim()).test(norm(w.name).trim()) || w.codes.some(c => norm(c).includes(kn));
}

/* Chuẩn hoá mã ảnh để so sánh: bỏ thư mục, đuôi .png/.jpg, tiền tố BUYWEAPON_INFO_, không phân biệt hoa/thường */
const normCode = s => norm(String(s || '').split(/[\\/]/).pop()).replace(/\.(png|jpg|jpeg|webp)$/i, '').replace(/^buyweapon_info_/, '').trim();
const prettyName = s => String(s || '').split(/[\\/]/).pop().replace(/\.(png|jpg|jpeg|webp)$/i, '').replace(/^buyweapon_info_/i, '').replace(/[_]+/g, ' ').trim();
let CODEIDX = new Map();   // mã ảnh chuẩn hoá -> {w: vũ khí, code: mã gốc trong Sheet}
function buildCodeIndex(){
  CODEIDX = new Map();
  for (const w of WEAPONS) for (const c of w.codes){
    const k = normCode(c);
    if (k && !CODEIDX.has(k)) CODEIDX.set(k, {w, code: c});
  }
}

function membersOf(set){
  const seen = new Set(), out = [];
  const add = (m, key) => { if (!seen.has(key)){ seen.add(key); out.push(m); } };
  const addWeapon = w => {
    for (const c of (w.codes.length ? w.codes : [null]))
      add({name: w.name, code: c, codes: w.codes, hints: w.hints, badges: w.badges, regions: w.regions}, c ? 'c:' + normCode(c) : 'n:' + norm(w.name));
  };
  const entries = set.codes.length ? set.codes : [set.name];   // cột B trống -> dùng tên set làm từ khoá
  for (const e of entries){                                    // giữ đúng thứ tự đã điền
    if (isFullCode(e)){
      const k = normCode(e), hit = CODEIDX.get(k);
      add(hit
        ? {name: hit.w.name, code: hit.code, codes: hit.w.codes, hints: hit.w.hints, badges: hit.w.badges, regions: hit.w.regions}   // có trong tab vũ khí: lấy tên, badge, thư mục ảnh, mã biến thể, tên theo khu vực
        : {name: prettyName(e), code: e, codes: [e], hints: [], badges: [], regions: []},                                            // không có: vẫn hiện ảnh, tên suy từ mã
        'c:' + k);
    } else {
      WEAPONS.forEach(w => { if (kwMatch(e, w)) addWeapon(w); });
    }
  }
  return out;
}

function imgTag(code, hints){
  const list = imgList(code, hints);
  if (!list.length) return '<span class="noimg">no image</span>';
  const [first, ...rest] = list;
  return `<img loading="lazy" src="${attr(first)}" alt="" data-alts="${attr(JSON.stringify(rest))}" onerror="__fb(this)">`;
}

function renderTabs(){
  const groups = [...new Set(SETS.map(s => s.group))];
  if (!groups.includes(currentGroup)) currentGroup = groups[0];
  // Chỉ có 1 nhóm (vd "Other") thì ẩn hàng nút nhóm; có từ 2 nhóm trở lên mới hiện
  $('tabs').innerHTML = groups.length < 2 ? '' : groups.map(g => `<button class="${g===currentGroup?'on':''}" data-g="${g}">${g}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { currentGroup = b.dataset.g; renderTabs(); renderList(); });
}

function renderList(){
  const q = norm($('search').value);
  const sets = SETS.filter(s => s.group === currentGroup && (!q || norm(s.name).includes(q)));
  $('list').innerHTML = sets.map(s => {
    const m = s.members;
    return `<button class="card" data-i="${SETS.indexOf(s)}">
      <div class="thumb">${imgTag(m.length ? m[0].code : null, m.length ? m[0].hints : null)}${badgesTag(s.badges)}${badgesTag(s.corner, 'tr')}</div>
      <div class="name">${s.name}</div></button>`;
  }).join('') || '<div class="noimg" style="padding:20px">Không có set nào.</div>';
  $('list').querySelectorAll('.card').forEach(c => c.onclick = () => openSet(SETS[+c.dataset.i]));
}

let popMembers = [];
function openSet(set){
  $('poptitle').textContent = set.name;
  popMembers = set.members;
  $('popbody').innerHTML = set.members.map((m, i) =>
    `<div class="card item" data-k="${i}"><div class="thumb">${imgTag(m.code, m.hints)}${badgesTag(m.badges)}</div><div class="name">${m.name}</div></div>`).join('')
    || '<div class="noimg" style="padding:20px">Chưa có vũ khí nào khớp với set này.</div>';
  $('overlay').classList.add('open');
}
const closeDetail = () => $('doverlay').classList.remove('open');
const closePop = () => { closeDetail(); $('overlay').classList.remove('open'); };

/* ===== Popup chi tiết vũ khí: bấm vào 1 vũ khí trong popup set ===== */
/* Nhãn nút biến thể: mã đầu tiên = Default; các mã sau lấy phần đuôi so với mã đầu (Silencer / Scope / Ext. Mag, còn lại giữ nguyên đuôi) */
const rawCode = c => String(c || '').split(/[\\/]/).pop().replace(/\.(png|jpg|jpeg|webp)$/i, '').replace(/^buyweapon_info_/i, '').trim();
function variantLabels(codes){
  const first = rawCode(codes[0]);
  return codes.map((c, i) => {
    if (!i) return 'Default';
    const r = rawCode(c);
    const suf = (r.toLowerCase().startsWith(first.toLowerCase()) ? r.slice(first.length) : r).replace(/^[_\s-]+/, '');
    if (/sil/i.test(suf)) return 'Silencer';
    if (/scope/i.test(suf)) return 'Scope';
    if (/ext|mag/i.test(suf)) return 'Ext. Mag';
    return suf.replace(/_/g, ' ') || 'Variant ' + (i + 1);
  });
}
function openDetail(i){
  const m = popMembers[i];
  if (!m) return;
  const codes = m.codes && m.codes.length ? m.codes : (m.code ? [m.code] : []);
  let cur = Math.max(0, codes.findIndex(c => normCode(c) === normCode(m.code)));   // mở đúng biến thể vừa bấm
  const labels = codes.length > 1 ? variantLabels(codes) : [];
  const paint = () => {
    $('dimg').innerHTML = imgTag(codes[cur] || null, m.hints);
    $('dvars').innerHTML = labels.map((l, k) => `<button type="button" class="vbtn${k === cur ? ' on' : ''}" data-v="${k}">${attr(l)}</button>`).join('');
    $('dcodes').innerHTML = codes.map((c, k) => `<div${k === cur ? ' class="on"' : ''}>${attr(rawCode(c))}</div>`).join('');
  };
  $('dtitle').textContent = m.name;
  // Vũ khí chưa có trong tab vũ khí (không có dữ liệu khu vực): vẫn hiện đủ các khu vực J–N, tên là "-"
  const regs = m.regions && m.regions.length ? m.regions : REGION_LABELS.map(l => ({region: l, name: '-'}));
  $('dregions').innerHTML = regs.length
    ? regs.map(r => `<span class="rg">${attr(r.region)}</span><span class="sp">|</span><span>${attr(r.name)}</span>`).join('')
    : '<span class="noimg" style="grid-column:1/-1">Chưa có tên theo khu vực.</span>';
  $('dcodes').style.display = codes.length ? '' : 'none';
  $('dvars').onclick = e => { const b = e.target.closest('.vbtn'); if (b){ cur = +b.dataset.v; paint(); } };
  paint();
  $('doverlay').classList.add('open');
}
$('popbody').addEventListener('click', e => { const it = e.target.closest('.item'); if (it) openDetail(+it.dataset.k); });
$('dclose').onclick = closeDetail;
$('doverlay').onclick = e => { if (e.target === $('doverlay')) closeDetail(); };
$('close').onclick = closePop;
$('overlay').onclick = e => { if (e.target === $('overlay')) closePop(); };
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('doverlay').classList.contains('open')) closeDetail(); else closePop();   // Esc: đóng popup chi tiết trước, rồi mới đóng popup set
});
$('search').oninput = renderList;
$('go').onclick = renderList;
$('reset').onclick = () => { $('search').value=''; renderList(); };

async function init(){
  try{
    const [res] = await Promise.all([
      Promise.allSettled([CONFIG.SETS_TAB, ...CONFIG.WEAPON_TABS].map(loadTab)),
      loadManifest()
    ]);
    if (res[0].status !== 'fulfilled') throw res[0].reason;   // tab WEAPON SETS bắt buộc phải tải được
    const setTab = res[0].value;
    const tabs = res.slice(1).filter(x => x.status === 'fulfilled').map(x => x.value);   // tab vũ khí nào lỗi thì bỏ qua
    const lt = tabs.find(t => t.labels && t.labels.slice(CONFIG.REGION_COL_FROM, CONFIG.REGION_COL_ACTIVE_TO + 1).some(Boolean));
    REGION_LABELS = [];
    if (lt) for (let i = CONFIG.REGION_COL_FROM; i <= CONFIG.REGION_COL_ACTIVE_TO; i++) REGION_LABELS.push(lt.labels[i] || colLetter(i));
    WEAPONS = tabs.flatMap(t => t.rows.map(r => ({
      name: (r[0] || '').trim(),
      codes: splitCodes(r[1]),
      hints: [r[2], r[3]],   // cột C (TYPE), D (CATEGORIZED): gợi ý thư mục ảnh, như trang Weapon
      badges: t.badgeCol >= 0 ? splitBadges(r[t.badgeCol]) : [],
      regions: regionsOf(r, t.labels)   // cột J–V: tên vũ khí theo khu vực
    }))).filter(w => w.name);
    SETS = setTab.rows.filter(r => (r[0] || '').trim()).map(r => ({
      name: r[0].trim(),
      group: 'Other',                    // cột B giờ là mã ảnh nên không còn dùng làm nhóm
      codes: splitCodes(r[1]),           // cột B: mã ảnh các vũ khí của set (điền tay)
      corner: splitBadges(r[2]),         // cột C: badge góc trên bên phải thẻ set
      badges: setTab.badgeCol >= 0 && setTab.badgeCol !== 2 ? splitBadges(r[setTab.badgeCol]) : []   // cột có tiêu đề BADGES khác cột C (nếu có): hiện góc dưới trái
    }));
    buildCodeIndex();
    SETS.forEach(s => s.members = membersOf(s));
    $('status').style.display = 'none';
    renderTabs(); renderList();
  }catch(err){
    $('status').textContent = 'Lỗi tải dữ liệu: ' + err.message + ' — kiểm tra SHEET_ID, tên tab và quyền chia sẻ "Anyone with the link".';
  }
}
init();
</script>
<script src="/nav.js"></script>
