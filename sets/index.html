<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weapon Sets</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff;--card:#fff;--tx:#111;--head:#111;--blue:#1677ff;--blue-h:#0f63d9;--label:#99ccff;--label-tx:#0a2540;--line:#d9d9d9;--muted:#6b7785;--thumb:#fff;--shadow:0 6px 18px rgba(0,0,0,.18)}
  @media(prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f1f;--tx:#eee;--head:#eee;--blue:#4da3ff;--blue-h:#6ab4ff;--label:#1d3552;--label-tx:#e6f1ff;--line:#3a3f45;--muted:#9aa5b1;--thumb:#262626;--shadow:0 6px 18px rgba(0,0,0,.6)}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:'Lexend',system-ui,sans-serif;padding:36px 16px 60px}
  .wrap{max-width:1620px;margin:0 auto;padding:0 8px}
  h1{text-align:center;font-size:26px;font-weight:700;margin:0 0 14px;color:var(--head)}
  #status{color:var(--muted);font-size:13px;text-align:center;margin-bottom:14px}
  .tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
  #search{width:min(420px,100%);height:34px;padding:0 12px;border-radius:4px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:400 13px 'Lexend',sans-serif;outline:none}
  #search:focus{border-color:var(--blue)}
  .btn{height:34px;padding:0 14px;background:var(--card);border:1px solid var(--line);border-radius:4px;color:var(--tx);font:600 13px 'Lexend',sans-serif;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.primary:hover{background:var(--blue-h);border-color:var(--blue-h);color:#fff}

  /* ---------- lưới thẻ ---------- */
  .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
  @media(max-width:900px){#list.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:560px){#list.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font:400 13px 'Lexend',sans-serif;color:var(--tx);margin-top:16px}
  .pager button{min-width:34px;height:34px;padding:0 10px;background:var(--card);border:1px solid var(--line);border-radius:4px;color:var(--tx);font:400 13px 'Lexend',sans-serif;cursor:pointer}
  .pager button:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
  .pager button:disabled{opacity:.4;cursor:default}
  .pager button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .pager input{width:64px;height:34px;padding:0 8px;background:var(--card);border:1px solid var(--line);border-radius:4px;color:var(--tx);font:400 13px 'Lexend',sans-serif;text-align:center}
  .card{position:relative;display:flex;flex-direction:column;width:100%;padding:0;background:var(--card);border:0;border-top:2px solid var(--blue);color:var(--label-tx);cursor:pointer;text-align:center;font:inherit;overflow:hidden;transition:.15s}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .thumb{position:relative;height:112px;display:flex;align-items:center;justify-content:center;background:var(--thumb)}
  .thumb img.w{max-width:82%;max-height:90px;object-fit:contain}
  .noimg{color:var(--muted);font-size:11px}
  .name{background:var(--label);color:var(--label-tx);padding:12px 8px;min-height:50px;flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 12px 'Lexend',sans-serif;line-height:1.35}
  .badges{position:absolute;left:8px;bottom:6px;display:flex;gap:4px}
  .badges img{height:16px;width:auto}
  .badges.tr{left:auto;bottom:auto;right:6px;top:6px}
  .badges.tr img{height:24px}

  /* nút khu vực / biến thể trên thẻ */
  .rsel{background:var(--label);display:flex;flex-direction:column;gap:4px;padding:8px 6px 0}
  .rsel+.name{min-height:36px;padding-top:6px}
  .rrow{display:flex;flex-wrap:nowrap;gap:4px;justify-content:center}
  .vbtn{height:26px;padding:0 12px;background:var(--card);border:1px solid var(--blue);border-radius:4px;color:var(--blue);font:700 12px 'Lexend',sans-serif;cursor:pointer}
  .vbtn.on{background:var(--blue);color:#fff}
  .rsel .vbtn{height:22px;padding:0 2px;font-size:var(--rfs,10px);line-height:20px;white-space:nowrap;min-width:0;overflow:hidden;flex:1 1 0}
  .rsel.multi .vbtn{flex:0 0 calc((100% - 16px)/5)}
  #pregions{display:flex;gap:6px;flex-wrap:wrap;padding:12px 20px 0;justify-content:center}
  #pregions:empty{display:none}
  .rbtn{height:30px;padding:0 14px;background:var(--card);border:1px solid var(--blue);border-radius:4px;color:var(--blue);font:600 12px 'Lexend',sans-serif;cursor:pointer;transition:.15s}
  .rbtn:hover{background:var(--label)}
  .rbtn.on{background:var(--blue);color:#fff}

  /* ---------- popup set (lưới vũ khí) ---------- */
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  #overlay.open{display:flex}
  #popup{background:var(--card);border-radius:8px;box-shadow:var(--shadow);width:fit-content;min-width:min(420px,100%);max-width:min(1500px,100%);max-height:88vh;display:flex;flex-direction:column}
  .pophead{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
  #popup h2{margin:0;font-size:18px;font-weight:700;color:var(--head)}
  #close{background:none;border:0;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
  #close:hover{color:var(--tx)}
  #popbody{overflow:auto;padding:18px 20px 22px}
  #popbody.grid{display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,230px));justify-content:center;gap:14px}
  #popbody .card{width:auto}
  #popbody .name{font-size:11px}
  #popbody .noimg{font-size:10px}

  /* ---------- popup chi tiết vũ khí (giống trang /weapon/) ---------- */
  #doverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
  #doverlay.open{display:flex}
  #dpop,#dpop *{font-family:'Lexend',system-ui,sans-serif;font-weight:700}
  #dpop{position:relative;width:max-content;min-width:min(780px,100%);max-width:100%;max-height:92vh;overflow:auto;background:var(--card);color:var(--tx);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  #dpop .dhead{background:var(--label);color:var(--label-tx);padding:16px 52px 16px 22px;font-size:18px;line-height:1.3}
  #dpop .dhead .dbdg{display:inline-flex;align-items:center;gap:6px;margin-left:10px;vertical-align:middle;position:relative;top:-2px}   /* thẻ BADGES sau tên vũ khí */
  #dpop .dhead .dbdg img{height:24px;width:auto;object-fit:contain}
  #dclose{position:absolute;top:12px;right:16px;font-size:22px;line-height:1;cursor:pointer;user-select:none;color:var(--label-tx);background:none;border:0;padding:0}
  #dpop .dmain{display:flex;flex-wrap:wrap;gap:24px;padding:20px 22px;align-items:center}
  #dpop .dleft{flex:1 1 300px;min-width:0}
  #dpop .dbox{height:200px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;background:var(--thumb)}
  #dpop .dbox img.w{max-width:92%;max-height:170px;object-fit:contain}
  #dpop .noimg{font-size:12px;font-weight:400}
  #dpop .dvars{display:flex;flex-wrap:nowrap;gap:3px;justify-content:center;padding:10px 0 0}   /* nút trong popup: luôn 1 hàng */
  #dpop .dvars:empty{display:none}
  #dpop .dvars .vbtn{flex:0 1 auto;min-width:0;height:auto;font-size:11px;padding:4px 8px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #dpop .dreg{flex:1 1 260px;font-size:14px;line-height:1.9}
  #dpop .dreg table{border-collapse:collapse}
  #dpop .dreg td{vertical-align:top;padding:0;white-space:nowrap}
  #dpop .dreg td:first-child{text-align:right}
  #dpop .dreg td.sep{padding:0 12px;color:var(--muted)}
  #dpop .dreg tr.rm td{color:var(--muted);text-decoration:line-through}
  #dpop .dreg s{text-decoration:line-through}
  #dpop .dcodes{width:0;min-width:100%;box-sizing:border-box;background:#000;color:#fbdf89;padding:12px 22px;font-size:14px;line-height:1.7;text-align:left;word-break:break-all}
  #dpop .dcodes .lb{color:#fff}

  /* ---------- nút Main Page (dự phòng khi mở file trực tiếp từ máy) ---------- */
  #hzNav{position:fixed;top:10px;left:16px;z-index:80;font-family:'Lexend',system-ui,sans-serif;font-size:14px}
  #hzNav .hzBtn{display:flex;align-items:stretch;height:40px;border-radius:8px;background:#1677ff;color:#fff;box-shadow:0 2px 8px rgba(22,119,255,.45);overflow:hidden}
  #hzNav .hzMain{display:flex;align-items:center;gap:8px;padding:0 12px;color:#fff;text-decoration:none;font:600 14px/1 'Lexend',system-ui,sans-serif}
  #hzNav .hzArrow{display:flex;align-items:center;padding:0 10px;border:0;border-left:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer}
  #hzNav .hzMain:hover,#hzNav .hzArrow:hover{background:#0f63d9}
  #hzNav svg{width:18px;height:18px;flex:none}
  #hzNav .hzCh{width:16px;height:16px;transition:transform .2s}
  #hzNav.open .hzCh{transform:rotate(180deg)}
  #hzNav .hzList{display:none;position:absolute;top:44px;left:0;min-width:100%;background:var(--card,#fff);color:var(--tx,#111);border:2px solid #1677ff;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.25);overflow:hidden}
  #hzNav.open .hzList{display:block}
  #hzNav.open::after{content:"";position:absolute;left:0;right:0;top:38px;height:10px}
  #hzNav .hzList a{display:block;padding:11px 16px;color:inherit;text-decoration:none;white-space:nowrap;border-bottom:1px solid var(--line,#e6e6e6)}
  #hzNav .hzList a:last-child{border-bottom:0}
  #hzNav .hzList a:hover{background:rgba(22,119,255,.12)}
  #hzNav .hzList a.cur{background:#1677ff;color:#fff;font-weight:600;pointer-events:none}
  @media(max-width:600px){body{padding-top:64px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Weapon Sets</h1>
  <div id="status">Đang tải dữ liệu...</div>
  <div class="tools">
    <input id="search" type="search" placeholder="Tim Weapon Sets" autocomplete="off">
    <button class="btn primary" id="go" type="button">Search</button>
    <button class="btn" id="reset" type="button">Reset</button>
  </div>
  <div id="list" class="grid"></div>
  <div class="pager" id="pager"></div>
</div>

<!-- popup set: lưới vũ khí của set (theo khu vực) -->
<div id="overlay"><div id="popup">
  <div class="pophead"><h2 id="poptitle"></h2><button id="close" type="button" aria-label="Đóng">&times;</button></div>
  <div id="pregions"></div>
  <div id="popbody" class="grid"></div>
</div></div>

<!-- popup chi tiết vũ khí: giống popup của https://hoangzii.pages.dev/weapon/ -->
<div id="doverlay"><div id="dpop">
  <div class="dhead" id="dtitle"></div>
  <button id="dclose" type="button" aria-label="Đóng">&times;</button>
  <div class="dmain">
    <div class="dleft"><div class="dbox" id="dimg"></div><div class="dvars" id="dvars"></div></div>
    <div class="dreg" id="dreg"></div>
  </div>
  <div class="dcodes" id="dcodes"></div>
</div></div>

<!-- tên vũ khí theo khu vực lấy từ ITEMCFT WORLD (file do trang Weapon tạo) -->
<script src="../weapon/regions.js" onerror="void 0"></script>
<script>
/* =========================================================
   CẤU HÌNH — chỉ sửa phần này
   ========================================================= */
const CONFIG = {
  SHEET_ID: '1GVgZrCybnuEdGPtVE33NMCmwRWSqfgLHIuz2XAXxhoc',
  SETS_TAB: 'WEAPON SETS',                                   // A: SET NAME · B: EXTRA KEYWORDS · C: PRESENT · D: BADGES
  WEAPON_TABS: ['RIFLE','SNIPER','SMG','MG','SHOTGUN','PISTOL','MELEE','THROW'],   // cột A tên · B BUYWEAPON_INFO · C/D thư mục · I badge · J–V tên theo khu vực
  // Ảnh dùng chung thư mục của trang Weapon: .../weapon/img/<TYPE>/BUYWEAPON_INFO_<mã>.PNG
  WEAPON_BASE: location.protocol === 'file:' ? '../weapon/' : '/weapon/',
  IMG_DIR: 'img/',
  // TẤT CẢ thư mục con trong weapon\img (tên đúng như trên ổ đĩa). Thêm thư mục mới vào đây (thư mục lồng nhau ghi dạng 'RIFLE/ABC').
  // Khi chạy trên web, trang còn tự nhận mọi ảnh trong img/ (mọi thư mục) nhờ weapon/manifest.json.
  IMG_SUBDIRS: ['RIFLE','SNIPER','SMG','SHOTGUN','MG','PISTOL','MELEE','GRENADE','FLASHBANG','SMOKE','SCOPE'],
  IMG_PREFIX: 'BUYWEAPON_INFO',
  BADGE_DIR: 'img/badges/',                                  // file tag_<tên>.PNG
  SINGLE_IMAGE: ['Knife-Hunting', 'Knife-Hunting Blade'],   // tên cột A hoặc mã: chỉ hiện hình mã đầu tiên, không có nút (giống trang Weapon)
  BADGE_POPUP_ONLY: ['slug'],                                // thẻ chỉ hiện trong popup chi tiết
  BADGE_ALIAS: { slug: 'slugammo14' },                       // ghi "Slug" ở cột BADGES => tag_slugammo14.png (giống trang Weapon)
  EXCLUDE_TOKENS: ['NM'],                                    // mã có đoạn này (vd ..._10th_NM) không được lấy khi khớp theo TỪ KHOÁ (ghi mã đầy đủ thì vẫn lấy)
  REGION_COL_FROM: 10,                                       // cột K (sau khi chèn cột SCOPE ở F)
  REGION_COL_TO: 22,                                         // cột W
  CLOSED_FROM: 15,                                           // cột P–W: khu vực đã đóng, ô có Removed hiện thêm bên dưới 5 khu vực trong popup chi tiết
  POPUP_REGIONS: ['China','Vietnam','Brazil','West','Philippines'],   // 5 dòng khu vực trong popup chi tiết (giống trang Weapon)
  REMOVED_WORDS: ['Removed','Closed'],
  DEFAULT_LABELS: ['Normal','Change'],
  // Chữ trên nút biến thể = COPY NGUYÊN từ CFG.VARIANT_RULES của weapon/index.html (khi trang Weapon đổi luật thì dán lại đoạn này).
  // Luật có merge:true: các DÒNG khác nhau trong Sheet (mã chỉ khác nhau ở đoạn tên) được gộp thành 1 thẻ có nhiều nút, như trang Weapon.
  VARIANT_RULES: [
    { match:'ThrowingAxe', tokens:['','ThrowingAxe'], labels:['Normal','Throwing'] },   // rìu có bản ném, vd BCAxe_Beast + ThrowingAxe_Beast
    { match:'USPMatch', tokens:['','USPMatch_S_'], labels:['Default','Silencer'] },   // USP Match có bản _S_ (giảm thanh), vd USPMatch_BornBeast + USPMatch_S_BornBeast
    { match:'_Slug', tokens:['','_BuckShot','_Slug'], labels:['Normal','Normal','Slug'] },   // shotgun có 2 mã: mã kết thúc _Slug = Slug, mã còn lại = Normal
    { match:'M249SPW', tokens:['','_Changemode','_Chg'], labels:['Normal','Shoulder Firing','Shoulder Firing'] },   // mọi khẩu M249 SPW có 2 chế độ
    { tokens:['DualUZI-Gold','DualUZI-Gold_2'], labels:['World','Vietnam'] },
    { tokens:['RifleBeast','KnifeBeast'], labels:['Default','Change Mode'] },
    { tokens:['BaiHu_VN26_NM','BaiHu_VN26'], labels:['Original','Virtus.Pro'] },
    { tokens:['Dominator_VN26_nm','Dominator_VN26'], labels:['Original','Twisted Minds'] },
    { tokens:['AWM-GOLD','AWM_GOLD'], labels:['World','JP/KR'] },
    { tokens:['BurningShot','BurningShot_Charge'], labels:['Normal','Charged'] },
    { tokens:['','_DrumMag'], labels:['Normal','Drum Magazine'], merge:true },
    { tokens:['','_Dmag'], labels:['Normal','Drum Magazine'], merge:true },
    { tokens:['','_Drum'], labels:['Normal','Drum Magazine'], merge:true },
    { tokens:['_Rifle','_Knife'], labels:['Gun','Knife'] },
    { tokens:['','_Carbine'], labels:['Default','Carbine'] },
    { tokens:['_GSpirit', '_GSpirit_Changemode'],         labels:['Normal','Change Mode'] },
    { tokens:['','_Changemode'], labels:['Normal','Dual'] },
    { tokens:['_Protocol','_Protocol_Chg'], labels:['Normal','Change Mode'] },
    { tokens:['_UnderTech','_UnderTech_Chg'], labels:['Normal','Change Mode'] },
    { tokens:['_UT','_UT_Chg'], labels:['Normal','Change Mode'] },
    { tokens:['M200_DemonicBeast','M200_DemonicBeast_Chg','M200_DemonicBeast_PVE'], labels:['PVP','PVE','PVE Charged'] },
    { tokens:['','_Chg'], labels:['Normal','Dual'] },
    { tokens:['','_DMR'], labels:['Normal','DMR'] },
    { tokens:['','_Change'], labels:['Default','Change'] },
    { tokens:['','_spear','_wheel'], labels:['PVP','Spear','Wheel'] },
    { tokens:['9A91_WildEagle','9A91_WildEagle_Silencer','9A91_WildEagle_Scope','9A91_WildEagle_ExtendMag'], labels:['Default','Silencer','Scope','Ext. Mag'], },
    { tokens:['_XS_1','_XS_2'], labels:['Grip','No Grip'] },
    // { tokens:['','_NT'],               labels:['regular','De-sign'] },   // hậu tố: ví dụ _NT thêm cuối tên file
    // { tokens:['_A','_B','_C'],         labels:['Một','Hai','Ba'] },     // 3 nút
  ]
};

/* ---------------- tiện ích ---------------- */
const $ = id => document.getElementById(id);
const AUTO_SHOW = /[?&]auto\b/.test(location.search);   // thêm ?auto vào link: tên tự điền hiện màu xanh
const norm = s => String(s || '').toLowerCase();
const reEsc = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const attr = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const html = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const colLetter = n => { let s = ''; for (n++; n > 0; n = Math.floor((n - 1) / 26)) s = String.fromCharCode(65 + (n - 1) % 26) + s; return s; };
const splitCodes = cell => String(cell || '').split(/[,;\n|]+/).map(s => s.trim()).filter(Boolean);   // cột B tab vũ khí: tách bằng , ; | hoặc xuống dòng
const splitBadges = cell => String(cell || '').split(/[,;\n]+/).map(s => s.trim()).filter(Boolean);

/* mã ảnh chuẩn hoá để so sánh: bỏ thư mục, đuôi ảnh, tiền tố BUYWEAPON_INFO_, không phân biệt hoa/thường */
const rawCode = c => String(c || '').split(/[\\/]/).pop().replace(/\.(png|jpg|jpeg|webp)$/i, '').replace(/^buyweapon_info_/i, '').trim();
const normCode = c => norm(rawCode(c));
const isFullCode = s => /^buyweapon_info_/i.test(String(s || '').split(/[\\/]/).pop().trim());
const prettyName = c => rawCode(c).replace(/_+/g, ' ');

/* ---------------- đọc Google Sheet (JSONP: chạy được cả khi mở file:// ) ---------------- */
let __gsN = 0;
const cellStr = c => c == null || c.v == null ? '' : String(c.f != null && typeof c.v === 'number' ? c.f : c.v).trim();
/* Đọc tab bằng link CSV (export?format=csv&gid=...): lấy TOÀN BỘ dòng, không bị bộ lọc trong Google Sheets làm ẩn dòng.
   Không đọc được thì quay về gviz (JSONP) như cũ. */
const TAB_GIDS = {'WEAPON SETS':'1723919006', RIFLE:'2098056846', SNIPER:'953162863', SMG:'1009811895', MG:'1975501148',
                  SHOTGUN:'969100198', PISTOL:'1168502877', MELEE:'750789659', THROW:'591776108'};
function parseCSVText(t){
  const out = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++){
    const ch = t[i];
    if (q){ if (ch === '"'){ if (t[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += ch; continue; }
    if (ch === '"') q = true;
    else if (ch === ','){ row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && t[i + 1] === '\n') i++; row.push(f); out.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f !== '' || row.length){ row.push(f); out.push(row); }
  return out;
}
async function loadTabCsv(name){
  const gid = TAB_GIDS[String(name).toUpperCase()];
  if (!gid) throw new Error(name + ': chưa có gid');
  const r = await fetch('https://docs.google.com/spreadsheets/d/' + CONFIG.SHEET_ID + '/export?format=csv&gid=' + gid + '&_=' + Date.now(), {cache: 'no-store'});
  if (!r.ok) throw new Error(name + ': HTTP ' + r.status);
  const txt = await r.text();
  if (/^\s*</.test(txt)) throw new Error(name + ': Sheet chưa chia sẻ công khai');
  const all = parseCSVText(txt.replace(/^\uFEFF/, ''));
  if (!all.length) throw new Error(name + ': trống');
  const n = Math.max(...all.map(a => a.length));
  const pad = a => { const o = []; for (let i = 0; i < n; i++) o.push(String(a[i] == null ? '' : a[i]).trim()); return o; };
  return {labels: pad(all[0]), rows: all.slice(1).map(pad).filter(x => x.some(Boolean))};
}
async function loadTab(name){
  try { return await loadTabCsv(name); } catch (e) { console.warn('[CSV] ' + e.message + ' -> dùng gviz (dòng bị bộ lọc trong Sheet có thể bị ẩn)'); }
  return loadTabGviz(name);
}
function loadTabGviz(name){
  return new Promise((resolve, reject) => {
    const cb = '__gs' + (++__gsN) + '_' + Date.now();
    const s = document.createElement('script');
    let timer;
    const cleanup = () => { clearTimeout(timer); delete window[cb]; s.remove(); };
    timer = setTimeout(() => { cleanup(); reject(new Error(name + ': hết thời gian chờ')); }, 15000);
    window[cb] = r => {
      cleanup();
      if (!r || r.status !== 'ok') return reject(new Error(name + ': ' + JSON.stringify((r && r.errors) || r)));
      const t = r.table;
      let labels = t.cols.map(c => (c.label || '').trim());
      const rows = t.rows.map(rw => t.cols.map((_, i) => cellStr(rw.c && rw.c[i])));
      if (labels.every(h => !h) && rows.length) labels = rows.shift().map(h => h.trim());
      resolve({rows, labels});
    };
    s.onerror = () => { cleanup(); reject(new Error(name + ': không tải được (sai tên tab, chưa chia sẻ hoặc mất mạng)')); };
    s.src = 'https://docs.google.com/spreadsheets/d/' + CONFIG.SHEET_ID + '/gviz/tq?sheet=' + encodeURIComponent(name) + '&headers=1&tqx=out:json;responseHandler:' + cb + '&_=' + Date.now();
    document.head.appendChild(s);
  });
}

/* ---------------- tên vũ khí theo khu vực (cột J–V) ---------------- */
const RM_RE = new RegExp('(^|[^\\p{L}\\p{N}])(?:' + CONFIG.REMOVED_WORDS.map(reEsc).join('|') + ')(?![\\p{L}\\p{N}])', 'giu');
function regionHTML(v, weaponName){
  v = String(v || '').trim();
  if (!v) return {html: '', removed: false};
  if (/[̵̶]/.test(v)){                       // chữ gạch ngang kiểu Unicode
    let out = '', open = false;
    const chars = [...v];
    chars.forEach((ch, i) => {
      if (ch === '̵' || ch === '̶') return;
      const struck = chars[i + 1] === '̵' || chars[i + 1] === '̶';
      if (struck && !open){ out += '<s>'; open = true; }
      if (!struck && open){ out += '</s>'; open = false; }
      out += html(ch);
    });
    if (open) out += '</s>';
    return {html: out, removed: false};
  }
  let removed = false;
  let t = v.replace(RM_RE, (m, pre) => { removed = true; return pre; });
  if (removed){
    t = t.replace(/\(\s*\)|\[\s*\]/g, '').replace(/^[\s|;,:\-–—]+|[\s|;,:\-–—]+$/g, '').trim();
    if (!t) t = weaponName || v;
  }
  return {html: html(t), removed};
}
function regionsOf(r, labels, weaponName){
  const out = [];
  for (let i = CONFIG.REGION_COL_FROM; i <= CONFIG.REGION_COL_TO; i++){
    const label = ((labels && labels[i]) || '').trim() || colLetter(i);
    const p = regionHTML(r[i], weaponName);
    out.push({label: label.replace(/[\u0335\u0336]/g, ''), idx: i, html: p.html, removed: p.removed, auto: !!(r.auto && r.auto.has(i))});
  }
  return out;
}

/* ================= TỰ ĐIỀN TÊN KHU VỰC TỪ "ITEMCFT WORLD" (weapon/regions.json) =================
   - Ô khu vực trong Sheet có chữ  => luôn dùng chữ trong Sheet (sửa tay trong Sheet là thắng).
   - Ô trống                       => tự lấy tên từ file Item??.csv của khu vực đó.
   - Ô ghi "-"                     => khu vực đó KHÔNG có vũ khí này, không tự điền.
   Cách nhận diện vũ khí: so tên các ô khu vực đã có (và cột A) với tên trong file CSV -> ra mã _ItemIndexInBute -> lấy tên ở khu vực khác.
   Nếu cùng 1 vũ khí có 2 dòng (vd bản Trung Quốc và bản _NM), dòng nào đã có tên ở khu vực đó thì dòng kia không bị điền thêm. */
// AUTO_STRICT = true: khu vực nào KHÔNG có mã cột B trong BF005 / ItemXX của khu vực đó thì bỏ trống, không đoán theo tên
// (tránh lấy tên bản thường cho skin riêng, vd Balisong_LuminousEdge_GC chỉ có ở Brazil). Đổi thành false để quay lại cách đoán theo tên.
const AUTO_STRICT = true;
// Từ đồng nghĩa khi so tên (bên trái đổi thành bên phải). Thêm cặp mới nếu gặp tên viết khác nhau giữa Sheet và CSV.
const AUTO_SYN = [['withoutthelogo','nm'],['withoutlogo','nm'],['nomark','nm'],['renovo','lenovo']];
const AUTO_NORM = s => AUTO_SYN.reduce((t, [a, b]) => t.split(a).join(b), String(s || '').normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ''));
const AUTO_BLANK = /^[\s\-–—]+$/;

function autoFillRegions(headers, rows, data, opt) {
  opt = opt || {};
  const from = opt.from, to = opt.to, nameCol = opt.nameCol || 0, imgCol = opt.imgCol == null ? 1 : opt.imgCol;
  const regs = (data && data.regions) || {};
  // cột khu vực nào có dữ liệu CSV
  const cols = [];
  for (let i = from; i <= to && i < headers.length; i++) {
    const h = String(headers[i] || '').replace(/[̵̶]/g, '').trim().toLowerCase();
    const r = Object.keys(regs).find(k => k.toLowerCase() === h);
    if (r) cols.push({ i, r });
  }
  if (!cols.length) return { filled: 0, unresolved: 0 };
  // chỉ mục tên -> mã cho từng khu vực
  const idx = {};
  for (const { r } of cols) {
    const m = idx[r] = new Map();
    const al = (data.alias && data.alias[r]) || {};
    for (const [k, names] of Object.entries(regs[r]))
      for (const n of names.concat(al[k] || [])) for (const z of new Set([AUTO_NORM(n), AUTO_NORM(n.replace(/\s*[(\[][^)\]]*[)\]]\s*$/, ''))])) { if (!z) continue; if (!m.has(z)) m.set(z, new Set()); m.get(z).add(k) }
  }
  const cover = k => cols.reduce((s, { r }) => s + (regs[r][k] ? 1 : 0), 0);
  const val = (row, i) => String(row[i] == null ? '' : row[i]).replace(/[̵̶]/g, '').trim();

  // 1) tìm mã cho từng dòng
  const _codesOf = row => String(row[imgCol] || '').split(/[,;\n|]+/).map(t => t.trim().replace(/\.(png|jpe?g|webp)$/i, '').replace(/^.*?BUYWEAPON_INFO_/i, '').toLowerCase()).filter(Boolean);
  const _hasIn = (r, c) => !!((data.icon && data.icon[r] && data.icon[r][c]) || (data.code && data.code[r] && data.code[r][c]) || (data.bfname && data.bfname[r] && data.bfname[r][c]));
  const _has = c => cols.some(({ r }) => (data.icon && data.icon[r] && data.icon[r][c]) || (data.code && data.code[r] && data.code[r][c]) || (data.bfname && data.bfname[r] && data.bfname[r][c]));
  const inData = (data.icon || data.code) ? (row => { const cs = _codesOf(row); return !cs.length || cs.some(c => _has(c) || _has(c.replace(/_nm$/, ''))); }) : null;
  const info = rows.map(row => {
    const score = new Map(), add = (k, w) => score.set(k, (score.get(k) || 0) + w);
    const ev = new Map(), mark = (k, r) => { if (!ev.has(k)) ev.set(k, new Set()); ev.get(k).add(r) };   // khu vực nào đã khớp với mã k
    const blocked = new Set();
    for (const { i, r } of cols) {
      const v = val(row, i);
      if (!v) continue;
      if (AUTO_BLANK.test(v)) { blocked.add(i); continue }
      const hit = idx[r].get(AUTO_NORM(v.replace(/\(?\b(removed|closed)\b\)?/gi, '')));
      if (hit) hit.forEach(k => { add(k, 3); mark(k, r) });   // tên đã ghi trong Sheet: tín hiệu mạnh nhất
    }
    // BF005: mã cột B = BigIconName / StandardName -> WeaponIndex (chính xác nhất, theo từng khu vực)
    const icon = new Map(), codesB = String(row[imgCol] || '').split(/[,;\n|]+/).map(t => t.trim().replace(/\.(png|jpe?g|webp)$/i, '').replace(/^.*?BUYWEAPON_INFO_/i, '').toLowerCase()).filter(Boolean);
    for (const { r } of cols) {
      const m = data.icon && data.icon[r]; if (!m) continue;
      const ks = new Set(); codesB.forEach(c => (m[c] || []).forEach(k => ks.add(k)));
      // mã có đuôi khu vực (vd AK47-Halloween_WEBR = bản West + Brazil): mã này không có trong BF005 của KHU VỰC NÀO thì dùng mã gốc,
      // chỉ cho đúng khu vực ghi ở đuôi (mã có ở 1 khu vực, vd Wukong_..._BR = màu Brown, thì không áp dụng)
      if (!ks.size && !codesB.some(c => cols.some(({ r: q }) => data.icon && data.icon[q] && data.icon[q][c]))) codesB.forEach(c => {
        const sm = c.match(/^(.+?)_((?:cn|vn|br|we|ph)+)$/); if (!sm) return;
        const rc = { China: 'cn', Vietnam: 'vn', Brazil: 'br', West: 'we', Philippines: 'ph' }[r];
        if (rc && sm[2].match(/../g).includes(rc)) (m[sm[1]] || []).forEach(k => ks.add(k));
      });
      if (ks.size) icon.set(r, [...ks]);
    }
    // Mã nội bộ (_NAME trong ItemXX.csv) trùng mã cột B (hoặc bỏ đuôi _NM): dùng khi BF005 không có (vd skin dạng F bên China)
    const byCode = new Map();
    for (const { r } of cols) {
      const m = data.code && data.code[r]; if (!m || icon.has(r)) continue;
      for (const c of codesB) { const hit = m[c] || m[c.replace(/_nm$/, '')]; if (hit) { byCode.set(r, hit[0]); break } }
    }
    // tên hình cột B (bỏ BUYWEAPON_INFO_) thường trùng tên nội bộ _NAME trong CSV (yếu hơn cột A vì 1 hình có thể dùng chung nhiều dòng)
    String(row[imgCol] || '').split(/[,;\n|]+/).map(t => t.trim().replace(/^.*?BUYWEAPON_INFO_/i, '')).filter(Boolean).forEach(im => {
      const hits = new Map();   // mã -> số khu vực khớp
      for (const { r } of cols) { const ks = new Set(); for (const z of [im, im.replace(/_(NM|RU|VN|BR|PH|WE|VNWE|CN|TW|JP|KR|ID|EU|ES|GC|SC|GL)$/i, '')]) { const h = idx[r].get(AUTO_NORM(z)); if (h) h.forEach(k => ks.add(k)) } ks.forEach(k => { hits.set(k, (hits.get(k) || 0) + 1); mark(k, r) }) }
      hits.forEach((c, k) => add(k, 1 + c * 0.1));
    });
    // tên cột A (thử thêm bản bỏ chữ biến thể, vd "AK47-B Victor Dragon" -> "AK47 Victor Dragon")
    const nm = String(row[nameCol] || '');
    for (const [z, w] of [[AUTO_NORM(nm), 2], [AUTO_NORM(nm.replace(/^(\S+?)-[A-Z]\s+/, '$1 ')), 1.2]]) {
      if (!z) continue;
      const hits = new Map();
      for (const { r } of cols) { const h = idx[r].get(z); if (h) h.forEach(k => { hits.set(k, (hits.get(k) || 0) + 1); mark(k, r) }) }
      if (hits.size) { hits.forEach((c, k) => add(k, w + c * 0.1)); break }
    }
    const keys = [...score.entries()].sort((x, y) => y[1] - x[1] || cover(y[0]) - cover(x[0]) || (+x[0]) - (+y[0])).map(x => x[0]);
    const best = keys.length ? score.get(keys[0]) : 0;
    const iscore = new Map(score);   // điểm có cộng BF005 (dùng để chọn giữa các mã BF005)
    icon.forEach(ks => ks.forEach(k => iscore.set(k, (iscore.get(k) || 0) + 4)));
    // tên cột A trùng y hệt 1 tên trong khu vực (vd "AK47-B" dùng chung hình AK-47) => ưu tiên hơn BF005
    const exact = new Map(), za = AUTO_NORM(nm);
    if (za) for (const { r } of cols) { const h = idx[r].get(za); if (h) exact.set(r, [...h]) }
    return { keys: keys.filter(k => score.get(k) === best), all: keys, ev, blocked, icon, score: iscore, exact, byCode };
  });

  // 2) nhóm cặp dòng bản thường / bản _NM (tên hình chỉ khác đuôi _NM)
  const par = rows.map((_, n) => n), find = n => par[n] === n ? n : (par[n] = find(par[n]));
  const join = (a, b) => { a = find(a); b = find(b); if (a !== b) par[b] = a };
  const img0 = n => String(rows[n][imgCol] || '').split(/[,;\n|]+/)[0].trim().toLowerCase();
  const base = new Map();
  rows.forEach((_, n) => { const im = img0(n); if (im && !/_nm$/.test(im)) base.set(im, n) });
  rows.forEach((_, n) => { const im = img0(n); if (/_nm$/.test(im) && base.has(im.replace(/_nm$/, ''))) join(base.get(im.replace(/_nm$/, '')), n) });
  const groups = new Map();
  rows.forEach((_, n) => { const g = find(n); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(n) });

  let filled = 0, unresolved = 0;
  rows.forEach((row, n) => {
    const x = info[n];
    for (const i of x.blocked) row[i] = '';
    // Mã cột B KHÔNG có trong BF005 / mã nội bộ của khu vực nào (vd skin riêng China như Balisong_LuminousEdge_GC) => bỏ qua, không đoán theo tên
    if (!x.keys.length && !x.icon.size && !x.byCode.size) { unresolved++; return }
    const grp = groups.get(find(n));
    for (const { i, r } of cols) {
      if (val(row, i) || x.blocked.has(i)) continue;
      if (AUTO_STRICT && inData && _codesOf(row).length && !_codesOf(row).some(c => _hasIn(r, c) || _hasIn(r, c.replace(/_nm$/, '')))) continue;   // mã không có trong BF005 / mã nội bộ của KHU VỰC NÀY => bỏ qua khu vực này
      if (grp.length > 1 && !x.icon.has(r)) {   // có khớp BF005 ở khu vực này thì điền luôn, không nhường cho dòng anh em (_NM)
        if (grp.some(m => m !== n && (val(rows[m], i) || info[m].blocked.has(i)))) continue;   // dòng anh em đã có tên khu vực này
        const isNM = m => /_nm(\b|_|$)/i.test(String(rows[m][imgCol] || ''));
        const pref = grp.filter(m => r === 'China' ? !isNM(m) : isNM(m));
        if ((pref.length ? pref[0] : grp[0]) !== n) continue;
      }
      // mã chính; nếu khu vực này không có thì chỉ dùng mã phụ đã khớp tên NGAY TRONG khu vực này (tránh lấy nhầm vũ khí khác)
      // có khớp BF005 ở khu vực này => chọn trong các mã BF005 (điểm cao nhất, hoà thì mã nhỏ nhất); không có => cách cũ
      const top = a => a && a.slice().sort((p, q) => (x.score.get(q) || 0) - (x.score.get(p) || 0) || (+p) - (+q)).find(k => regs[r][k]);
      const ik = x.icon.get(r);
      const k = top(x.exact.get(r)) || (ik && ik.slice().sort((a, b) => (x.score.get(b) || 0) - (x.score.get(a) || 0) || (+a) - (+b)).find(k => regs[r][k]))
        || x.keys.find(k => regs[r][k]) || x.all.find(k => regs[r][k] && x.ev.get(k) && x.ev.get(k).has(r));
      const nmC = !x.exact.get(r) && !ik && x.byCode.get(r);   // mã nội bộ ưu tiên hơn cách đoán theo tên
      if (!k && !nmC) continue;
      row[i] = nmC || regs[r][k][0];
      (row.auto || (row.auto = new Set())).add(i);
      filled++;
    }
  });
  return { filled, unresolved };
}

/* VŨ KHÍ TÍCH HỢP: mã ở cột B của 1 dòng cũng nằm ở cột B (vị trí thứ 2 trở đi) của dòng khác => lấy tên khu vực của dòng đó.
   Vd "Glock-18C-G Iron Wolf" (Glock18C_IronWolf) lấy tên của "M4A1-S Iron Wolf" (M4A1_S_IronWolf , Glock18C_IronWolf).
   Ô khu vực đã ghi tay ở dòng tích hợp vẫn được giữ; chỉ thay ô trống / ô tự điền. Mã đuôi _NGB cũng khớp với _NG. */
function inheritIntegrated(rows, opt){
  const from = opt.from, to = opt.to, imgCol = opt.imgCol == null ? 1 : opt.imgCol;
  const codesOf = r => String(r[imgCol] || '').split(/[,;\n|]+/).map(t => t.trim().replace(/\.(png|jpe?g|webp)$/i, '').replace(/^.*?BUYWEAPON_INFO_/i, '').toLowerCase()).filter(Boolean);
  const owner = new Map();
  rows.forEach(r => codesOf(r).slice(1).forEach(k => { if (!owner.has(k)) owner.set(k, r); }));
  let n = 0;
  rows.forEach(r => {
    let src = null;
    for (const k of codesOf(r)){ const s = owner.get(k) || owner.get(k.replace(/_ngb$/, '_ng')); if (s && s !== r){ src = s; break; } }
    if (!src) return;
    for (let i = from; i <= to; i++){
      const v = String(src[i] == null ? '' : src[i]).trim(), cur = String(r[i] == null ? '' : r[i]).trim();
      if (!v || (cur && !(r.auto && r.auto.has(i)))) continue;
      r[i] = src[i]; (r.auto || (r.auto = new Set())).add(i); n++;
    }
  });
  return n;
}
/* NHIỀU MÃ Ở CỘT B (cùng 1 loại súng, vd StimRevolver_RagingBull_Gun , StimRevolver_Astronaut):
   tra BF005 / mã nội bộ cho TỪNG mã; ra từ 2 tên khác nhau trở lên ở 1 khu vực => ghi "Tên 1, Tên 2".
   Chỉ áp dụng khi các mã cùng tiền tố (phần trước dấu _ đầu tiên) để không gộp vũ khí tích hợp khác loại (vd M4A1 + Glock).
   Ô đã ghi tay trong Sheet vẫn giữ nguyên. CODE_ALIAS: mã không có món riêng trong ItemXX.csv -> mã của món chứa nó. */
const CODE_ALIAS = {
  stimrevolver_ragingbull_gun: 'heartstimulater',            // Stimulator Revolver nằm trong Heart Stimulator Sword
  stimrevolver_astronaut: 'heartstimulater_astronaut'
};
function multiCodeNames(rows, data, opt){
  const from = opt.from, to = opt.to, imgCol = opt.imgCol == null ? 1 : opt.imgCol, headers = opt.headers || [];
  if (!data || !data.regions) return 0;
  const codesOf = r => [...new Set(String(r[imgCol] || '').split(/[,;\n|]+/).map(t => t.trim().replace(/\.(png|jpe?g|webp)$/i, '').replace(/^.*?BUYWEAPON_INFO_/i, '').toLowerCase()).filter(Boolean))];
  const cols = [];
  for (let i = from; i <= to && i < headers.length; i++){
    const h = String(headers[i] || '').replace(/[̵̶]/g, '').trim().toLowerCase();
    const r = Object.keys(data.regions).find(k => k.toLowerCase() === h);
    if (r) cols.push({i, r});
  }
  const nameOf = (r, c) => {
    c = CODE_ALIAS[c] || c;
    const regs = data.regions[r] || {}, ic = (data.icon && data.icon[r]) || {}, cd = (data.code && data.code[r]) || {};
    for (const x of [c, c.replace(/_nm$/, '')]){
      const ks = (ic[x] || []).filter(k => regs[k]).sort((a, b) => (+a) - (+b));
      if (ks.length) return regs[ks[0]][0];
      if (cd[x] && cd[x][0]) return cd[x][0];
    }
    return '';
  };
  let n = 0;
  rows.forEach(row => {
    const cs = codesOf(row);
    if (cs.length < 2) return;
    if (new Set(cs.map(c => c.split('_')[0])).size > 1) return;   // khác loại súng => không gộp
    for (const {i, r} of cols){
      const cur = String(row[i] == null ? '' : row[i]).trim();
      if (cur && !(row.auto && row.auto.has(i))) continue;          // ô ghi tay: giữ
      const names = [...new Set(cs.map(c => nameOf(r, c)).filter(Boolean))];
      if (names.length >= 2 || (names.length === 1 && !cur)){
        row[i] = names.join(', '); (row.auto || (row.auto = new Set())).add(i); n++;
      }
    }
  });
  return n;
}
/* DỰ PHÒNG BF005: dòng vẫn trống CẢ 5 khu vực (mã có trong BF005 nhưng không có món trong ItemXX.csv, vd DualAxe)
   => lấy tên WeaponName trong BF005 của từng khu vực. Chỉ dùng khi dòng chưa có tên nào để tránh điền nhầm. */
function bfNameFallback(rows, data, opt){
  const from = opt.from, to = opt.to, imgCol = opt.imgCol == null ? 1 : opt.imgCol, headers = opt.headers || [];
  if (!data || !data.bfname) return 0;
  const cols = [];
  for (let i = from; i <= to && i < headers.length; i++){
    const h = String(headers[i] || '').replace(/[̵̶]/g, '').trim().toLowerCase();
    const r = Object.keys(data.bfname).find(k => k.toLowerCase() === h);
    if (r) cols.push({i, r});
  }
  let n = 0;
  rows.forEach(row => {
    if (cols.some(({i}) => String(row[i] == null ? '' : row[i]).trim())) return;
    const cs = String(row[imgCol] || '').split(/[,;\n|]+/).map(t => t.trim().replace(/\.(png|jpe?g|webp)$/i, '').replace(/^.*?BUYWEAPON_INFO_/i, '').toLowerCase()).filter(Boolean);
    for (const {i, r} of cols){
      const m = data.bfname[r] || {};
      const names = [...new Set(cs.map(c => m[c] || m[c.replace(/_nm$/, '')]).filter(Boolean))];
      if (names.length){ row[i] = names.join(', '); (row.auto || (row.auto = new Set())).add(i); n++; }
    }
  });
  return n;
}
/* ---------------- tìm ảnh (giống trang Weapon) ---------------- */
let MAN = {};      // manifest.json: khớp hoa/thường trên Cloudflare
let MANIDX = new Map();   // tên file ảnh (không đuôi, chữ thường) -> đường dẫn thật, tìm trong MỌI thư mục của img/
function buildManIdx(){
  MANIDX = new Map();

  for (const k of Object.keys(MAN)){
    if (!k.startsWith(root) || k.startsWith(root + 'badges/') || !/\.(png|jpg|jpeg|webp)$/i.test(k)) continue;
    const nm = k.split('/').pop().replace(/\.(png|jpg|jpeg|webp)$/i, '');
    if (!MANIDX.has(nm)) MANIDX.set(nm, MAN[k]);

}
async function loadManifest(){

const fixPath = p => { try{ return MAN[decodeURIComponent(p).toLowerCase()] || p; }catch(e){ return p; } };
function imgList(code, hints){
  if (Array.isArray(code)) return [...new Set(code.flatMap(c => imgList(c, hints)))];   // nhiều mã: thử lần lượt
  if (!code) return [];
  const n = String(code).split(/[\\/]/).pop().trim();
  const m = n.match(/\.(png|jpg|jpeg|webp)$/i);
  const ext = m ? m[0] : '';
  let base = ext ? n.slice(0, -ext.length) : n;
  if (!base.toUpperCase().startsWith(CONFIG.IMG_PREFIX)) base = CONFIG.IMG_PREFIX + '_' + base;
  const exts = [...new Set(ext ? [ext, '.PNG', '.png'] : ['.PNG', '.png', '.jpg'])];
  const clean = x => x.replace(/[\/]+$/, '');
  const first = (hints || []).map(x => (x || '').trim()).filter(Boolean).map(x => CONFIG.IMG_DIR + clean(x) + '/');
  const sub = CONFIG.IMG_SUBDIRS.map(d => CONFIG.IMG_DIR + d + '/');
  const dirs = [...new Set([...first, CONFIG.IMG_DIR, ...sub])];
  const bare = base.slice(CONFIG.IMG_PREFIX.length + 1);       // tên không có tiền tố BUYWEAPON_INFO_
  const known = [MANIDX.get(base.toLowerCase()), MANIDX.get(bare.toLowerCase())].filter(Boolean);   // web: có sẵn đường dẫn thật ở bất kỳ thư mục nào
  const list = [...known,
    ...dirs.flatMap(d => exts.map(e => fixPath(d + base + e))),     // BUYWEAPON_INFO_<mã> ở mọi thư mục
    ...dirs.flatMap(d => exts.map(e => fixPath(d + bare + e)))];    // dự phòng: file không có tiền tố (vd thư mục SCOPE)
  return [...new Set(list)].map(p => CONFIG.WEAPON_BASE + p);
}
window.__fb = img => {

/* ---------------- nhãn nút biến thể (luật của trang Weapon) ---------------- */
const baseOf = c => { let n = String(c || '').split(/[\\/]/).pop().trim().replace(/\.(png|jpg|jpeg|webp)$/i, ''); if (!n.toUpperCase().startsWith(CONFIG.IMG_PREFIX)) n = CONFIG.IMG_PREFIX + '_' + n; return n; };
function tmpLabels(name, bases){   // Steyr TMP 3-4 mã: Normal, Dual, Mutation[, Charged] (mã thứ 3 là AWM/Charge => Charged)
  if(/plasma\s*knife/i.test(name||'')&&bases.length===2)return ['PVP','PVE'];   // Plasma Knife (2 mã): PVP, PVE theo thứ tự cột B
  if(bases.length===2&&/gatlinggun1$/i.test(bases[0])&&/gatlinggun2$/i.test(bases[1]))return ['Green','Purple'];   // Gatling Gun-Halloween: GatlingGun1 = Green, GatlingGun2 = Purple
  if(bases.length>1&&bases.every(b=>/_lv(\d+|max)$/i.test(b)))return bases.map((_,k)=>'Level '+(k+1));   // mã đuôi _Lv1, _Lv2, _Lv3, _LvMax (vd KnockbackHammer) => Level 1 - 4 theo thứ tự cột B
  if(/invisible\s*assassin\s*sword/i.test(name||'')&&/master\s*hunter/i.test(name||'')&&bases.length===2)return ['Default','Phantom'];   // Invisible Assassin Sword-Master Hunter (2 mã): Default, Phantom theo thứ tự cột B
  if(/hyperion\s*gauntlet/i.test(name||'')&&bases.length===2)return ['Normal','PVE Charged'];   // Hyperion Gauntlet (2 mã): Normal, PVE Charged theo thứ tự cột B
  if(/card/i.test(name||'')&&/mercenary\s*forces/i.test(name||'')&&bases.length>1){   // Card-Mercenary Forces: theo thứ tự mã ở cột B
    const N=['A Min','An Qi Er','Fei','Mo'];return bases.map((_,k)=>N[k]||('#'+(k+1)));
  }
  if(bases.some(b=>/card_rm_.*_(platinum|master|pog)$/i.test(b))){   // Card Rank Match (vd Card_RM_TD_S31_Platinum / _Master / _POG): theo đuôi mã
    const N={platinum:'Platinum',master:'Master',pog:'Path of Glory'};
    return bases.map((b,k)=>{const m=b.match(/_([a-z]+)$/i);return (m&&N[m[1].toLowerCase()])||('#'+(k+1))});
  }
  if(bases.some(b=>/card_heartshot_\d+$/i.test(b))){   // Card HeartShot: số cuối mã => tên nhân vật
    const N={1:'Lan Xier',2:'Qingya',3:'Wu Mengmeng',5:'Esports Yun'};
    return bases.map((b,k)=>{const m=b.match(/_(\d+)$/);return (m&&N[m[1]])||('#'+(k+1))});
  }
  if(/rank\s*match/i.test(name||'')&&bases.length>1)return bases.map((_,k)=>'Level '+(k+1));   // tên có "Rank Match" + nhiều mã (vd BTFknife_White, _Platinum, _Purple, _Rainbow) => Level 1, 2, 3...
  if(bases.some(b=>/rsh12_infection_rm|bcaxe_rm_/i.test(b))&&bases.length>1)return bases.map((_,k)=>'Level '+(k+1));   // RSh-12 Infection RM (Level 1-4), BCAxe_RM_... (Level 1-6): theo thứ tự mã ở cột B
  if(/raging\s*bull/i.test(name||'')&&bases.length===2){   // Raging Bull theo thứ tự mã ở cột B
    if(/judgement|judgment/i.test(name))return ['PVP','PVE'];
    if(/stimulator/i.test(name))return ['Default','Astronaut'];
  }
  if(/vepr-?\s*12/i.test(name||'')&&/rampage/i.test(name||'')&&bases.length>=2&&bases.length<=3)   // Vepr-12 Rampage: mã thường = PVP, có _PvE = PVE, có _Slug = PVE Slug (không phụ thuộc thứ tự)
    return bases.map(b=>/_slug/i.test(b)?'PVE Slug':/_pve/i.test(b)?'PVE':'PVP');
  if(/\baa-?12\b/i.test(name||'')&&!bases.some(b=>/_slug$/i.test(b))){   // AA-12 có mã _Slug (vd AA12_IronBeast + AA12_IronBeast_Slug) => để luật Slug xử lý: Normal, Slug   // AA-12 theo thứ tự mã ở cột B: 3 mã = PVP, PVE, Change Mode | 2 mã = PVP, PVE
    if(bases.length===3)return ['PVP','PVE','Change Mode'];
    if(bases.length===2)return ['PVP','PVE'];
  }
  if(/gatling\s*gun/i.test(name||'')&&/wild\s*shot/i.test(name)&&bases.length===2)return ['Normal','PVE Charged'];   // Gatling Gun-Wild Shot (2 mã): Normal, PVE Charged
  if(/\bp90\b/i.test(name||'')){   // P90-Frenzy (2 mã): PVP, PVE | P90-Wild Shot (4 mã): PVP, PVP Dual, PVE, PVE Charged
    if(/frenzy/i.test(name)&&bases.length===2)return ['PVP','PVE'];
    if(/wild\s*shot/i.test(name)&&bases.length===4)return ['PVP','PVP Dual','PVE','PVE Charged'];
  }
  if(!/\btmp\b/i.test(name||'')||bases.length<3||bases.length>4)return null;
  if(bases.length===4)return ['Normal','Dual','Mutation','Charged'];
  return ['Normal','Dual',/AWM|Charge/i.test(bases[2])?'Charged':'Mutation'];
}
function variantLabels(codes, name){
  const bases = codes.map(baseOf);
  const tl = tmpLabels(name, bases); if (tl) return tl;
  const has = (ru, b) => ru.tokens.some(t => t && b.includes(t));
  const rule = CONFIG.VARIANT_RULES.find(ru => (!ru.match || bases.some(b => b.toLowerCase().includes(ru.match.toLowerCase()))) && bases.some(b => has(ru, b)));
  return bases.map((b, k) => {
    if (rule){
      let bi = -1, len = -1;
      rule.tokens.forEach((t, j) => { if (t && b.includes(t) && t.length > len){ bi = j; len = t.length; } });
      if (bi < 0) bi = rule.tokens.indexOf('');
      if (bi >= 0 && rule.labels[bi]) return rule.labels[bi];
    }
    return CONFIG.DEFAULT_LABELS[k] || ('#' + (k + 1));
  });
}

/* =========================================================
   NHẬN DIỆN VŨ KHÍ CỦA SET
   - Cột B tab WEAPON SETS (EXTRA KEYWORDS): mỗi mục là MÃ ẢNH hoặc TỪ KHOÁ, cách nhau bằng , ; hoặc xuống dòng.
     Chia khu vực bằng từng dòng "Tên khu vực: mục1, mục2".
   - Mỗi mục được đối chiếu với cột B (BUYWEAPON_INFO) của MỌI tab vũ khí:
       1) trùng đúng 1 mã ảnh (bỏ tiền tố BUYWEAPON_INFO_, không phân biệt hoa/thường) -> lấy vũ khí chứa mã đó
       2) không trùng đúng -> coi là từ khoá: lấy vũ khí có tên (cột A) chứa nguyên từ đó hoặc có mã ảnh chứa từ đó
       3) không có trong cột B của tab nào (chưa điền dữ liệu ở RIFLE–THROW) -> KHÔNG hiển thị
   ========================================================= */
let SETS = [], WEAPONS = [], CODEIDX = new Map(), REGION_LABELS = [];
function buildCodeIndex(){
  CODEIDX = new Map();
  for (const w of WEAPONS) for (const c of w.codes){ const k = normCode(c); if (k && !CODEIDX.has(k)) CODEIDX.set(k, {w, code: c}); }
}
const wordRe = t => new RegExp('(^|[^a-z0-9])' + reEsc(norm(t)) + '([^a-z0-9]|$)');
function kwMatch(k, w){
  const kn = norm(k).trim();
  if (!kn) return false;
  return wordRe(k.trim()).test(norm(w.name).trim()) || w.codes.some(c => normCode(c).includes(kn));
}
function isExcludedCode(c){
  const toks = (CONFIG.EXCLUDE_TOKENS || []).map(t => norm(t).trim()).filter(Boolean);
  if (!toks.length || c == null) return false;
  const segs = normCode(c).split(/[^a-z0-9]+/);
  return toks.some(t => segs.includes(t));
}
/* điểm khớp: độ dài từ khoá nếu khớp, dùng để chia khu vực (từ khoá dài hơn thắng: VTC10TH thuộc Vietnam, không lọt vào China) */
function kwScore(k, w, c){
  const kn = norm(k).trim();
  if (!kn || isFullCode(k)) return 0;
  return (wordRe(k.trim()).test(norm(w.name).trim()) || (c != null && normCode(c).includes(kn))) ? kn.length : 0;
}
function memberOf(w, code, codes){ return {w, name: w.name, code, codes: codes || w.codes, hints: w.hints, badges: w.badges, regions: w.regions}; }

/* ----- gộp biến thể giữa các DÒNG khác nhau của Sheet theo VARIANT_RULES có merge:true (giống buildEntries của trang Weapon) ----- */
let MERGE = new Map();   // vũ khí (dòng Sheet) -> nhóm {ru, members:[{w,j}]}
function buildMergeGroups(){
  const mrules = CONFIG.VARIANT_RULES.map((ru, ri) => ({ru, ri})).filter(x => x.ru.merge);
  MERGE = new Map();
  if (!mrules.length) return;
  const rows = WEAPONS.filter(w => w.codes[0]);
  const byKey = new Map(), of = new Map();
  rows.forEach(w => {
    const base = baseOf(w.codes[0]);
    for (const {ru, ri} of mrules){
      let j = -1, len = -1;
      ru.tokens.forEach((t, k) => { if (t && base.includes(t) && t.length > len){ j = k; len = t.length; } });
      if (j < 0) continue;
      const stem = base.replace(ru.tokens[j], '').toLowerCase(), key = ri + '|' + stem;
      let g = byKey.get(key);
      if (!g){ g = {ru, stem, members: []}; byKey.set(key, g); }
      if (g.members.some(m => m.j === j)) return;
      g.members.push({w, j}); of.set(w, g);
      return;
    }
  });
  const defs = new Map();                                   // dòng mặc định (không chứa đoạn tên) ghép vào nhóm cùng "stem"
  byKey.forEach(g => { const e = g.ru.tokens.indexOf(''); if (e >= 0){ if (!defs.has(g.stem)) defs.set(g.stem, []); defs.get(g.stem).push(g); } });
  rows.forEach(w => {
    if (of.has(w)) return;
    const gs = defs.get(baseOf(w.codes[0]).toLowerCase());
    if (!gs) return;
    const g = gs.find(x => { const e = x.ru.tokens.indexOf(''); return !x.members.some(m => m.j === e); });
    if (!g) return;
    g.members.push({w, j: g.ru.tokens.indexOf('')}); of.set(w, g);
  });
  of.forEach((g, w) => { if (g.members.length >= 2) MERGE.set(w, g); });
}
/* mỗi vũ khí trong set có danh sách "biến thể" vars: {w: dòng Sheet, code: mã ảnh, label: chữ nút} */
function toVars(m){
  const w = m.w, g = w && MERGE.get(w), mk = normCode(m.code);
  if (g && g.members.some(x => normCode(x.w.codes[0]) === mk)){
    const ms = g.members.slice().sort((a, b) => a.j - b.j);
    m.vars = ms.map(x => ({w: x.w, code: x.w.codes[0], label: g.ru.labels[x.j] || g.ru.tokens[x.j] || '#'}));
    m.vi = Math.max(0, ms.findIndex(x => normCode(x.w.codes[0]) === mk));
  } else {
    const codes = m.codes && m.codes.length ? m.codes : (m.code ? [m.code] : []);
    if (w && codes.length > 1 && (CONFIG.SINGLE_IMAGE || []).some(n => [norm(w.name).trim(), ...codes.map(c => normCode(c))].includes(norm(n).trim()))){ m.vars = [{w, code: codes[0], label: ''}]; m.vi = 0; return m; }   // SINGLE_IMAGE: hình mã đầu, không nút
    const labels = codes.length > 1 ? variantLabels(codes, w.name) : [''];
    m.vars = codes.length ? codes.map((c, k) => ({w, code: c, label: labels[k]})) : [{w, code: null, label: ''}];
    m.vi = Math.max(0, codes.findIndex(c => normCode(c) === mk));
  }
  return m;
}
const varInfo = (m, v) => ({name: v.w ? v.w.name : m.name, regions: v.w ? v.w.regions : [], hints: v.w ? v.w.hints : [], badges: v.w ? v.w.badges : []});

function membersOf(set, list, others){
  const seen = new Set(), out = [];
  const add = (m, key) => { if (!seen.has(key)){ seen.add(key); out.push(m); } };
  const ownKw = (list || []).filter(x => !CODEIDX.has(normCode(x)) && !isFullCode(x));
  const othKw = (others || []).filter(x => !CODEIDX.has(normCode(x)) && !isFullCode(x));
  const belongs = (w, c) => {
    if (isExcludedCode(c)) return false;
    if (!othKw.length) return true;
    const own = Math.max(0, ...ownKw.map(k => kwScore(k, w, c)));
    const oth = Math.max(0, ...othKw.map(k => kwScore(k, w, c)));
    return own >= oth;
  };
  const entries = list || [];                                // cột B trống => set chưa có vũ khí nào để hiện trong popup
  for (const e of entries){
    const hit = CODEIDX.get(normCode(e));
    if (hit){                                              // 1) trùng đúng mã ở cột B tab vũ khí
      add(memberOf(hit.w, hit.code), 'c:' + normCode(hit.code));
    } else {                                               // 2) từ khoá (chỉ lấy vũ khí ĐÃ có dữ liệu trong các tab vũ khí)
      WEAPONS.forEach(w => {
        if (!kwMatch(e, w)) return;
        if (!w.codes.length) return;                         // dòng chưa điền cột B (BUYWEAPON_INFO) => chưa hiển thị
        const codes = w.codes.filter(c => belongs(w, c));
        for (const c of codes) add(memberOf(w, c, codes), 'c:' + normCode(c));
      });
      /* mục không có trong cột B của tab RIFLE–THROW nào => KHÔNG hiển thị (điền dữ liệu vào tab vũ khí thì tự hiện) */
    }
  }
  /* vũ khí có nhiều mã / nhiều dòng biến thể chỉ hiện 1 thẻ (các biến thể chọn bằng nút) */
  const merged = [];
  out.forEach(m => {
    toVars(m);
    const ks = m.vars.map(v => normCode(v.code)).filter(Boolean);
    const dup = merged.find(x => x.vars.some(v => ks.includes(normCode(v.code))));
    if (!dup) merged.push(m);
  });
  return merged;
}

/* cột B / PRESENT chia theo khu vực: dòng "Tên khu vực: mục1, mục2"; mục điền trước mọi khu vực là mục CHUNG */
function parseRegional(cell){
  const common = [], regs = [];
  let cur = null;
  for (const line of String(cell || '').split(/\r?\n/)){
    const m = line.match(/^\s*([^:,;|]+?)\s*:\s*(.*)$/);
    let body = line;
    if (m){
      const nm = m[1].trim();
      cur = regs.find(g => norm(g.name) === norm(nm));
      if (!cur){ cur = {name: nm, codes: []}; regs.push(cur); }
      body = m[2];
    }
    (cur ? cur.codes : common).push(...splitCodes(body));
  }
  return {common, regs};
}

/* ẢNH ĐẠI DIỆN ngoài thẻ set = CHỈ lấy từ cột C (PRESENT), theo khu vực đang chọn (không có thì dùng mục chung / khu vực đầu tiên của PRESENT).
   Không phụ thuộc việc tab RIFLE–THROW đã điền dữ liệu hay chưa: mã PRESENT được tìm thẳng trong weapon\img. PRESENT trống => no image. */
function presentOf(set, region){
  const pp = set.presentP;
  const rg = region && pp.regs.find(g => norm(g.name) === norm(region));
  const p = ((rg && rg.codes[0]) || pp.common[0] || (pp.regs[0] && pp.regs[0].codes[0]) || '').trim();
  if (!p) return {code: null, hints: null};
  const hit = CODEIDX.get(normCode(p));
  if (hit) return {code: hit.code, hints: hit.w.hints};    // có dữ liệu ở tab vũ khí: dùng thêm gợi ý thư mục (cột C/D)
  return {code: p, hints: []};                             // chưa có dữ liệu: vẫn tìm ảnh theo mã ở mọi thư mục của img
}

/* ---------------- thẻ set ---------------- */
function cardHtml(s){
  const pr = presentOf(s, s.cur);
  const rbtn = g => `<button type="button" class="vbtn${norm(g.name) === norm(s.cur) ? ' on' : ''}" data-r="${attr(g.name)}">${html(g.name)}</button>`;
  let rs = '';
  if (s.regions.length > 1){
    const rows = [];
    for (let i = 0; i < s.regions.length; i += 5) rows.push('<div class="rrow">' + s.regions.slice(i, i + 5).map(rbtn).join('') + '</div>');
    rs = `<div class="rsel${s.regions.length > 5 ? ' multi' : ''}">${rows.join('')}</div>`;
  }
  return `<div class="card setcard" data-i="${SETS.indexOf(s)}">
    <div class="thumb">${imgTag(pr.code, pr.hints)}${badgesTag(cardBadges(s.badges), 'tr')}</div>
    ${rs}<div class="name">${html(s.name)}</div></div>`;
}
function fitRegions(root){
  (root || document).querySelectorAll('.rsel').forEach(box => {
    const btns = [...box.querySelectorAll('.vbtn')];
    let fs = 10;
    box.style.setProperty('--rfs', fs + 'px');
    while (fs > 5 && btns.some(b => b.scrollWidth > b.clientWidth + 0.5)){ fs -= 0.5; box.style.setProperty('--rfs', fs + 'px'); }
  });
}
const PER_PAGE = 20;                          // 5 cột x 4 hàng
let curPage = 1;
function renderList(resetPage){
  if (resetPage) curPage = 1;
  const q = norm($('search').value).trim();
  const sets = SETS.filter(s => !q || norm(s.name).includes(q) || norm(s.extraRaw).includes(q));
  const pages = Math.max(1, Math.ceil(sets.length / PER_PAGE));
  if (curPage > pages) curPage = pages;
  const slice = sets.slice((curPage - 1) * PER_PAGE, curPage * PER_PAGE);
  $('list').innerHTML = slice.map(cardHtml).join('') || '<div class="noimg" style="padding:20px">Không có set nào.</div>';
  fitRegions($('list'));
  let p = `<button id="pPrev"${curPage <= 1 ? ' disabled' : ''}>‹</button>`;
  const show = new Set([1, pages, curPage - 1, curPage, curPage + 1].filter(x => x >= 1 && x <= pages));
  let last = 0;
  [...show].sort((a, b) => a - b).forEach(x => { if (x - last > 1) p += '<span>…</span>'; p += `<button class="pg${x === curPage ? ' on' : ''}" data-p="${x}">${x}</button>`; last = x; });
  p += `<button id="pNext"${curPage >= pages ? ' disabled' : ''}>›</button><span>Jump to</span><input type="number" min="1" max="${pages}" id="pj" value="${curPage}"><button id="pGo">Go</button>`;
  $('pager').style.display = pages > 1 ? '' : 'none';
  $('pager').innerHTML = p;
  $('pPrev').onclick = () => { curPage--; renderList(); };
  $('pNext').onclick = () => { curPage++; renderList(); };
  document.querySelectorAll('#pager .pg').forEach(b => b.onclick = () => { curPage = +b.dataset.p; renderList(); });
  $('pGo').onclick = () => { curPage = Math.min(pages, Math.max(1, +$('pj').value || 1)); renderList(); };
  $('pj').onkeydown = e => { if (e.key === 'Enter') $('pGo').click(); };
}
window.addEventListener('resize', () => fitRegions($('list')));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitRegions($('list')));
$('list').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const s = SETS[+card.dataset.i];
  const b = e.target.closest('.vbtn');
  if (b){                                    // đổi khu vực ngay trên thẻ
    s.cur = b.dataset.r;
    card.outerHTML = cardHtml(s);
    fitRegions($('list').querySelector(`.setcard[data-i="${SETS.indexOf(s)}"]`));
    return;
  }
  openSet(s);
});

/* ---------------- popup set ---------------- */
let popSet = null, popRegion = '', popMembers = [];
function openSet(set){
  popSet = set;
  popRegion = set.cur || (set.regions[0] ? set.regions[0].name : '');
  renderPop();
  $('overlay').classList.add('open');
}
function memberCard(m, i){
  if (!m.vars) toVars(m);
  const v = m.vars[m.vi] || m.vars[0], info = varInfo(m, v);
  let vs = '';
  if (m.vars.length > 1){
    const labels = m.vars.map(x => x.label), rows = [];
    const btn = (l, k) => `<button type="button" class="vbtn${k === m.vi ? ' on' : ''}" data-v="${k}">${html(l)}</button>`;
    for (let k = 0; k < labels.length; k += 5) rows.push('<div class="rrow">' + labels.slice(k, k + 5).map((l, j) => btn(l, k + j)).join('') + '</div>');
    vs = `<div class="rsel${labels.length > 5 ? ' multi' : ''}">${rows.join('')}</div>`;
  }
  return `<div class="card item" data-k="${i}"${m.probe ? ' data-probe="1"' : ''}><div class="thumb">${imgTag(v.alts || v.code, info.hints)}${badgesTag(cardBadges(info.badges))}</div>${vs}<div class="name">${html(info.name)}</div></div>`;
}
function renderPop(){
  const set = popSet;
  $('poptitle').textContent = set.name;
  $('pregions').innerHTML = set.regions.length > 1
    ? set.regions.map(g => `<button type="button" class="rbtn${norm(g.name) === norm(popRegion) ? ' on' : ''}" data-r="${attr(g.name)}">${html(g.name)}</button>`).join('')
    : '';
  const g = set.regions.find(x => norm(x.name) === norm(popRegion));
  popMembers = g ? g.members : set.members;
  $('popbody').style.setProperty('--cols', Math.max(1, Math.min(6, popMembers.length)));
  $('popbody').innerHTML = popMembers.map(memberCard).join('') || '<div class="noimg" style="padding:20px">Chưa có vũ khí nào khớp với set này.</div>';
  fitRegions($('popbody'));
}
$('pregions').onclick = e => {
  const b = e.target.closest('.rbtn');
  if (!b) return;
  popRegion = b.dataset.r;
  renderPop();
};
$('popbody').addEventListener('click', e => {
  const it = e.target.closest('.item');
  if (!it) return;
  const i = +it.dataset.k, m = popMembers[i], b = e.target.closest('.vbtn');
  if (b && m){                               // đổi biến thể ngay trên thẻ
    m.vi = +b.dataset.v;
    it.outerHTML = memberCard(m, i);
    fitRegions($('popbody').querySelector(`.item[data-k="${i}"]`));
    return;
  }
  openDetail(i);
});

/* ---------------- popup chi tiết vũ khí (giống trang Weapon) ---------------- */
function openDetail(i){
  const m = popMembers[i];
  if (!m) return;
  if (!m.vars) toVars(m);
  let cur = m.vi || 0;
  const labels = m.vars.length > 1 ? m.vars.map(x => x.label) : [];
  const codes = [...new Set(m.vars.flatMap(v => v.w ? v.w.codes : [v.code]).filter(Boolean))];   // mọi mã ảnh của vũ khí (như dải System Name ở trang Weapon)
  const paint = () => {
    const v = m.vars[cur] || m.vars[0], info = varInfo(m, v);
    $('dtitle').innerHTML = html(info.name) + (info.badges && info.badges.length ? '<span class="dbdg">' + info.badges.map(b => { const [first, ...rest] = badgeList(b); return `<img class="bd" src="${attr(first)}" alt="${attr(b)}" title="${attr(b)}" data-alts="${attr(JSON.stringify(rest))}" onerror="__fb(this)">`; }).join('') + '</span>' : '');   // tên + thẻ BADGES
    $('dreg').innerHTML = '<table>' + CONFIG.POPUP_REGIONS.map(n => {
      const r = info.regions.find(x => norm(x.label).trim() === norm(n));
      const has = r && r.html;
      const au = has && AUTO_SHOW && r.auto;
      return `<tr${has && r.removed ? ' class="rm"' : ''}><td>${html(n)}</td><td class="sep">|</td><td${au ? ' style="color:#1a73e8" title="Tự điền từ ITEMCFT WORLD"' : ''}>${has ? r.html : '–'}</td></tr>`;
    }).join('') +
    /* cột P–W: ô có Removed (gạch ngang) => thêm khu vực đó bên dưới 5 khu vực chính, theo thứ tự cột */
    info.regions.filter(r => r.idx >= CONFIG.CLOSED_FROM && r.html && !CONFIG.POPUP_REGIONS.some(n => norm(n) === norm(r.label).trim()))
      .map(r => `<tr class="rm"><td>${html(r.label)}</td><td class="sep">|</td><td>${r.html}</td></tr>`).join('') + '</table>';
    $('dimg').innerHTML = imgTag(v.alts || v.code, info.hints);
    $('dvars').innerHTML = labels.map((l, k) => `<button type="button" class="vbtn${k === cur ? ' on' : ''}" data-v="${k}">${html(l)}</button>`).join('');
    const names = codes.map(c => html(rawCode(c)));
    const note = [...new Set(m.vars.map(x => x.w && x.w.note).filter(Boolean))].map(html).join('<br>');
    $('dcodes').innerHTML = '<span class="lb">System Name:</span>' + (note ? ' ' + note : names.length > 1 ? '<br>' + names.join('<br>') : ' ' + (names[0] || '(no image name)'));   // có câu ghi chú => hiện thay cho mã
  };
  $('dvars').onclick = e => { const b = e.target.closest('.vbtn'); if (b){ cur = +b.dataset.v; m.vi = cur; paint(); } };
  paint();
  $('doverlay').classList.add('open');
}
const closeDetail = () => $('doverlay').classList.remove('open');
const closePop = () => { closeDetail(); $('overlay').classList.remove('open'); };
$('dclose').onclick = closeDetail;
$('doverlay').onclick = e => { if (e.target === $('doverlay')) closeDetail(); };
$('close').onclick = closePop;
$('overlay').onclick = e => { if (e.target === $('overlay')) closePop(); };
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('doverlay').classList.contains('open')) closeDetail(); else closePop();
});
$('search').oninput = renderList;
$('go').onclick = renderList;
$('reset').onclick = () => { $('search').value = ''; renderList(true); };

/* ---------------- khởi chạy ---------------- */
async function init(){
  try{
    const [res] = await Promise.all([
      Promise.allSettled([CONFIG.SETS_TAB, ...CONFIG.WEAPON_TABS].map(loadTab)),
      loadManifest()
    ]);
    if (res[0].status !== 'fulfilled') throw res[0].reason;
    const setTab = res[0].value;
    const okTabs = [], bad = [];
    res.slice(1).forEach((x, i) => x.status === 'fulfilled' ? okTabs.push(x.value) : bad.push(CONFIG.WEAPON_TABS[i]));
    if (window.REGIONS_DATA && okTabs.length){                // tự điền ô khu vực trống (cột K–O) từ ITEMCFT WORLD, giống trang Weapon
      try{
        const st = autoFillRegions(okTabs[0].labels, okTabs.flatMap(t => t.rows), window.REGIONS_DATA, {from: CONFIG.REGION_COL_FROM, to: CONFIG.REGION_COL_TO, nameCol: 0, imgCol: 1});
        console.log('[ITEMCFT] tự điền', st.filled, 'ô');
      }catch(e){ console.warn('[ITEMCFT] lỗi tự điền:', e); }
    }
    try{ inheritIntegrated(okTabs.flatMap(t => t.rows), {from: CONFIG.REGION_COL_FROM, to: CONFIG.REGION_COL_TO, imgCol: 1}); }catch(e){ console.warn(e); }
    try{ multiCodeNames(okTabs.flatMap(t => t.rows), window.REGIONS_DATA, {from: CONFIG.REGION_COL_FROM, to: CONFIG.REGION_COL_TO, imgCol: 1, headers: okTabs[0].labels}); }catch(e){ console.warn(e); }   // nhiều mã cùng loại => "Tên 1, Tên 2"   // vũ khí tích hợp lấy tên khu vực của dòng chính
    try{ bfNameFallback(okTabs.flatMap(t => t.rows), window.REGIONS_DATA, {from: CONFIG.REGION_COL_FROM, to: CONFIG.REGION_COL_TO, imgCol: 1, headers: okTabs[0].labels}); }catch(e){ console.warn(e); }   // còn trống hết => tên WeaponName trong BF005
    WEAPONS = okTabs.flatMap(t => {
      const bc = t.labels.findIndex(h => /^badges?$/i.test(h));
      const badgeCol = bc >= 0 ? bc : 8;
      return t.rows.map(r => ({
        name: (r[0] || '').trim(),
        codes: splitCodes(r[1]).filter(c => !(/\s/.test(c) && !/BUYWEAPON_INFO/i.test(c))),   // cột B = BUYWEAPON_INFO (bỏ câu ghi chú)
        note: String(r[1] || '').split(/[;\n|]+/).map(t => t.trim()).filter(t => /\s/.test(t) && !/BUYWEAPON_INFO/i.test(t)).join(' '),   // câu ghi chú, vd "This weapon does not exist in CrossFire."
        hints: [r[2], r[3]],                           // cột C / D: gợi ý thư mục ảnh
        badges: splitBadges(r[badgeCol]),
        regions: regionsOf(r, t.labels, (r[0] || '').trim())
      }));
    }).filter(w => w.name || w.codes.length);
    const hd = setTab.labels.map(h => h.toUpperCase());
    const find = (re, def) => { const k = hd.findIndex(h => re.test(h)); return k >= 0 ? k : def; };
    const colName = find(/^SET NAME$/, 0), colExtra = find(/EXTRA|KEYWORD/, 1), colPresent = find(/^PRESENT$/, 2), colBadge = find(/^BADGES?$/, 3);
    SETS = setTab.rows.filter(r => (r[colName] || '').trim()).map(r => ({
      name: r[colName].trim(),
      extraRaw: r[colExtra] || '',
      parsed: parseRegional(r[colExtra]),
      presentP: parseRegional(r[colPresent]),
      badges: splitBadges(r[colBadge])
    }));
    buildCodeIndex();
    buildMergeGroups();
    SETS.forEach(s => {
      const pc = s.parsed;
      /* khu vực của set = khu vực ở cột B (EXTRA KEYWORDS) + khu vực chỉ có ở cột C (PRESENT) để nút vùng trên thẻ đổi được ảnh đại diện */
      const names = [];
      [...pc.regs, ...s.presentP.regs].forEach(g => { if (!names.some(n => norm(n) === norm(g.name))) names.push(g.name); });
      s.regions = names.map(n => {
        const g = pc.regs.find(x => norm(x.name) === norm(n));
        return {name: n, members: g ? membersOf(s, [...pc.common, ...g.codes], pc.regs.filter(x => x !== g).flatMap(x => x.codes)) : membersOf(s, pc.common, [])};
      });
      s.members = s.regions.length ? s.regions[0].members : membersOf(s, pc.common);
      s.cur = s.regions.length ? s.regions[0].name : '';
    });
    $('status').textContent = bad.length ? 'Không đọc được tab: ' + bad.join(', ') : '';
    $('status').style.display = bad.length ? '' : 'none';
    renderList();
  }catch(err){
    $('status').textContent = 'Lỗi tải dữ liệu: ' + err.message + ' — kiểm tra tên tab và quyền chia sẻ "Anyone with the link".';
  }
}
init();
